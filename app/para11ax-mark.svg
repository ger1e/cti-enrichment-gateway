<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" role="img" aria-labelledby="title desc">
  <title id="title">PARA11AX</title>
  <desc id="desc">Compact PARA11AX analyst header logo with a gunmetal sentinel helmet and phosphor visor.</desc>
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303A32"/><stop offset=".5" stop-color="#111713"/><stop offset="1" stop-color="#050806"/></linearGradient>
    <filter id="visorGlow" x="-100%" y="-160%" width="300%" height="420%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="sentinel-helmet" transform="translate(2 2)">
    <path d="M26 1 49 12v28L26 53 3 40V12z" fill="#061008" stroke="#39FF14" stroke-opacity=".7" stroke-width="1.4"/>
