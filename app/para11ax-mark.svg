  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="900" letter-spacing="2.2">
    <text x="64" y="36" font-size="25"><tspan fill="#F7FFF6">PARA</tspan><tspan fill="#39FF14">11</tspan><tspan fill="#F7FFF6">AX</tspan></text>
  </g>
  <path d="M65 44h222" stroke="#39FF14" stroke-opacity=".34"/>
  <path d="M287 44h17" stroke="#FF2438" stroke-width="1.5" stroke-opacity=".7"/>
  <circle cx="308" cy="44" r="2" fill="#FF2438"/>
