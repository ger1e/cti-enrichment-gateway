name: Temporary IP report patch

on:
  push:
    branches:
      - enhance/ip-report-max-depth-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Apply deterministic patch
        run: node scripts/apply-ip-report-max-patch.mjs
      - name: Commit GREEN implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/view-model.js app/renderers.js app/analyst-facts.css test/ip-report-max.test.mjs
          git diff --cached --check
          git commit -m "feat: deepen deterministic IP analyst report"
          git push origin HEAD:${GITHUB_REF_NAME}
