name: Generate README heroes

on:
  push:
    branches:
      - fix-mobile-readme-globe
    paths:
      - scripts/generate_readme_heroes.py
      - .github/workflows/generate-readme-heroes.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate responsive GIFs
        run: python scripts/generate_readme_heroes.py
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/para11ax-readme-hero-v5.gif assets/brand/para11ax-readme-hero-mobile-v5.gif
          if git diff --cached --quiet; then
            echo 'Generated assets already current.'
            exit 0
          fi
          git commit -m 'build: generate responsive README hero GIFs'
          git push origin HEAD:fix-mobile-readme-globe
