name: Tooling smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck jq

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Validate JSON
        run: |
          jq -e . package.json >/dev/null
          jq -e . .devcontainer/devcontainer.json >/dev/null

      - name: Verify Node floor
        run: node -e "if (+process.versions.node.split('.')[0] < 20) process.exit(1)"

      - name: Test
        run: npm test
