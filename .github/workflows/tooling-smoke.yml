name: Tooling smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_cross_platform:
        description: Run paid macOS and Windows Maltego validation in addition to Ubuntu
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write

concurrency:
  group: tooling-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mark Tooling smoke pending
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"Tooling smoke\",\"description\":\"Core validation is running\",\"target_url\":\"${target_url}\"}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Validate locked dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev

      - name: Validate MAXX invariants and Node tests
        run: npm run check

      - name: Validate Maltego tests
        run: |
          python3 --version
          cd maltego
          python3 -m unittest discover -s tests -v

      - name: Compile Maltego Python
        run: python3 -m compileall -q maltego

      - name: Validate shell syntax
        run: |
          bash -n maltego/install.sh
          shellcheck maltego/install.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/bootstrap-vercel.ps1',
            'scripts/finalize.ps1',
            'maltego/install.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $file"
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              exit 1
            }
          }

      - name: Publish Tooling smoke success
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"Tooling smoke\",\"description\":\"Core validation passed on Ubuntu\",\"target_url\":\"${target_url}\"}"

  maltego_macos:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_cross_platform && needs.validate.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: macOS Python bash and zsh tests
        run: |
          python3 --version
          cd maltego
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q .
          bash -n install.sh
          zsh -n install.sh

  maltego_windows:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_cross_platform && needs.validate.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Windows Python tests
        run: |
          $python = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($python) {
            & $python.Source --version
            Push-Location maltego
            try {
              & $python.Source -m unittest discover -s tests -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $python.Source -m compileall -q .
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          } else {
            $py = Get-Command py.exe -ErrorAction SilentlyContinue
            if (-not $py) { throw 'No Python interpreter found on Windows runner.' }
            & $py.Source -3 --version
            Push-Location maltego
            try {
              & $py.Source -3 -m unittest discover -s tests -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $py.Source -3 -m compileall -q .
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          }
      - name: Windows PowerShell installer syntax
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'maltego/install.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
