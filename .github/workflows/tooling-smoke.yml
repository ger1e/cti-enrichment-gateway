name: Tooling smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  statuses: write

concurrency:
  group: tooling-smoke-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"Tooling smoke\",\"description\":\"Tooling smoke started\",\"target_url\":\"${target_url}\"}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # Upstream post-v7 security fix for GHSA-3jxr-9vmj-r5cp; use the next
        # immutable release once it contains the patched dist bundle.
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install validation tools
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends shellcheck jq

      - name: Validate MAXX invariants and Node tests
        run: npm run check

      - name: Validate Maltego client and mapper
        run: |
          python3 --version
          cd maltego
          python3 -m unittest discover -s tests -v

      - name: Compile Maltego Python
        run: python3 -m compileall -q maltego

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/bootstrap-vercel.ps1',
            'maltego/install.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $file"
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              exit 1
            }
          }

      - name: Publish final status
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "${JOB_STATUS}" in
            success) state="success" ;;
            failure) state="failure" ;;
            cancelled) state="error" ;;
            *) state="error" ;;
          esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Tooling smoke\",\"description\":\"Tooling smoke ${JOB_STATUS}\",\"target_url\":\"${target_url}\"}"
