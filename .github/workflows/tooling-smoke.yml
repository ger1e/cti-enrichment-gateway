name: Tooling smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  statuses: write

concurrency:
  group: tooling-smoke-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep the workflow run itself green to avoid GitHub failure-notification mail.
    # Real validation state is published separately as the "Tooling smoke" commit status.
    continue-on-error: true
    steps:
      - name: Publish pending status
        id: pending_status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"Tooling smoke\",\"description\":\"Tooling smoke started\",\"target_url\":\"${target_url}\"}"

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup_node
        continue-on-error: true
        # Upstream post-v7 security fix for GHSA-3jxr-9vmj-r5cp; use the next
        # immutable release once it contains the patched dist bundle.
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install validation tools
        id: install_tools
        continue-on-error: true
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends shellcheck jq

      - name: Validate MAXX invariants and Node tests
        id: node_checks
        continue-on-error: true
        run: npm run check

      - name: Validate Maltego client and mapper
        id: maltego_tests
        continue-on-error: true
        run: |
          python3 --version
          cd maltego
          python3 -m unittest discover -s tests -v

      - name: Compile Maltego Python
        id: python_compile
        continue-on-error: true
        run: python3 -m compileall -q maltego

      - name: Validate PowerShell syntax
        id: powershell_syntax
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(
            'scripts/bootstrap-vercel.ps1',
            'maltego/install.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $file"
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              exit 1
            }
          }

      - name: Publish final status
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_TOOLS: ${{ steps.install_tools.outcome }}
          NODE_CHECKS: ${{ steps.node_checks.outcome }}
          MALTEGO_TESTS: ${{ steps.maltego_tests.outcome }}
          PYTHON_COMPILE: ${{ steps.python_compile.outcome }}
          POWERSHELL_SYNTAX: ${{ steps.powershell_syntax.outcome }}
        run: |
          state="success"
          description="Tooling smoke passed"
          for outcome in \
            "${CHECKOUT}" \
            "${SETUP_NODE}" \
            "${INSTALL_TOOLS}" \
            "${NODE_CHECKS}" \
            "${MALTEGO_TESTS}" \
            "${PYTHON_COMPILE}" \
            "${POWERSHELL_SYNTAX}"; do
            if [[ "${outcome}" != "success" ]]; then
              state="failure"
              description="Tooling smoke validation failed"
              break
            fi
          done

          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Tooling smoke\",\"description\":\"${description}\",\"target_url\":\"${target_url}\"}"
