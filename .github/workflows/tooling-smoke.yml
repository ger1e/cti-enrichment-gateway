name: Tooling smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: tooling-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install validation tools
        id: install_tools
        continue-on-error: true
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends shellcheck jq zsh

      - name: Validate locked dependencies
        id: dependency_checks
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev

      - name: Validate MAXX invariants and Node tests
        id: node_checks
        continue-on-error: true
        run: npm run check

      - name: Validate Maltego tests
        id: maltego_tests
        continue-on-error: true
        run: |
          python3 --version
          cd maltego
          python3 -m unittest discover -s tests -v

      - name: Compile Maltego Python
        id: python_compile
        continue-on-error: true
        run: python3 -m compileall -q maltego

      - name: Validate bash zsh and ShellCheck
        id: posix_syntax
        continue-on-error: true
        run: |
          bash -n maltego/install.sh
          zsh -n maltego/install.sh
          shellcheck maltego/install.sh

      - name: Validate PowerShell syntax
        id: powershell_syntax
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(
            'scripts/bootstrap-vercel.ps1',
            'scripts/finalize.ps1',
            'maltego/install.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $file"
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              exit 1
            }
          }

      - name: Summarize core validation
        id: core_status
        if: ${{ always() }}
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_TOOLS: ${{ steps.install_tools.outcome }}
          DEPENDENCY_CHECKS: ${{ steps.dependency_checks.outcome }}
          NODE_CHECKS: ${{ steps.node_checks.outcome }}
          MALTEGO_TESTS: ${{ steps.maltego_tests.outcome }}
          PYTHON_COMPILE: ${{ steps.python_compile.outcome }}
          POSIX_SYNTAX: ${{ steps.posix_syntax.outcome }}
          POWERSHELL_SYNTAX: ${{ steps.powershell_syntax.outcome }}
        run: |
          state="success"
          for outcome in \
            "${CHECKOUT}" "${SETUP_NODE}" "${INSTALL_TOOLS}" "${DEPENDENCY_CHECKS}" "${NODE_CHECKS}" \
            "${MALTEGO_TESTS}" "${PYTHON_COMPILE}" "${POSIX_SYNTAX}" "${POWERSHELL_SYNTAX}"; do
            if [[ "${outcome}" != "success" ]]; then state="failure"; break; fi
          done
          echo "state=${state}" >> "${GITHUB_OUTPUT}"

      - name: Publish authoritative Tooling smoke status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
          CORE: ${{ steps.core_status.outputs.state }}
        run: |
          state="${CORE}"
          description="Tooling smoke passed on Ubuntu"
          if [[ "${state}" != "success" ]]; then
            state="failure"
            description="Tooling smoke validation failed"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Tooling smoke\",\"description\":\"${description}\",\"target_url\":\"${target_url}\"}"

      - name: Enforce core validation result
        if: ${{ always() && steps.core_status.outputs.state != 'success' }}
        run: exit 1
