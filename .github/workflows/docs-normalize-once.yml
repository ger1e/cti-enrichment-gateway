name: One-shot documentation normalizer

on:
  push:
    branches:
      - docs/ger1e-normalize-current

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/ger1e-normalize-current
          fetch-depth: 0

      - name: Normalize all tracked Markdown and restore documentation compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          MARKER = '<!-- PARA11AX-DOC-STANDARD: GER1E/PARA11AX v1 -->'
          FOOTER = '<p align="center"><sub>PΛRΛ11ΛX // PER ASPERA AD ASTRA</sub></p>'
          HISTORICAL = (
              '> **Document status:** Historical design record. Preserved for implementation history; '
              'current behavior is defined by [docs/ARCHITECTURE.md]'
              '(https://github.com/ger1e/para11ax/blob/main/docs/ARCHITECTURE.md) and the current README.'
          )

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          readme = read('README.md')
          readme = re.sub(r'\bCTI evidence gateway\b', 'CTI enrichment/correlation core', readme, flags=re.I)
          readme = readme.replace('<sub><strong>03 // INTELLIGENCE KERNEL</strong></sub>', '<sub><strong>INTELLIGENCE KERNEL v1.0</strong></sub>')
          readme = readme.replace('<sub><strong>04 // ANALYST SURFACE</strong></sub>', '<sub><strong>03 // ANALYST SURFACE</strong></sub>')
          readme = readme.replace('<sub><strong>05 // SEMANTIC FIREWALL</strong></sub>', '<sub><strong>04 // SEMANTIC FIREWALL</strong></sub>')
          readme = readme.replace('<sub><strong>06 // PROVIDER FABRIC</strong></sub>', '<sub><strong>05 // PROVIDER FABRIC</strong></sub>')
          readme = readme.replace('<sub><strong>07 // SECURITY / VERIFICATION / DOCS</strong></sub>', '<sub><strong>06 // SECURITY & VERIFICATION</strong></sub>')
          deep_docs = '<sub><strong>07 // DEEP DOCS</strong></sub>'
          if deep_docs not in readme:
              readme = readme.replace('\n<sub>[BRAND](docs/BRAND.md)', f'\n{deep_docs}\n\n<sub>[BRAND](docs/BRAND.md)', 1)
          if 'para11ax-radar-lockup.svg' not in readme:
              readme = readme.rstrip() + '\n\n<p align="center"><img src="assets/brand/para11ax-radar-lockup.svg" alt="PARA11AX" width="180"></p>\n'
          write('README.md', readme)

          architecture = read('docs/ARCHITECTURE.md')
          architecture = re.sub(r'\bCTI evidence gateway\b', 'CTI enrichment/correlation core', architecture, flags=re.I)
          architecture = architecture.replace('../assets/brand/para11ax-readme-architecture-v4.svg', '../assets/brand/para11ax-architecture.svg')
          write('docs/ARCHITECTURE.md', architecture)

          security = read('SECURITY.md')
          security = re.sub(r'\bCTI evidence gateway\b', 'CTI enrichment/correlation core', security, flags=re.I)
          write('SECURITY.md', security)

          evidence = read('docs/EVIDENCE-SCHEMA.md')
          boundary = 'Error envelopes do not add evidenceGraph or guidance; failed requests do not manufacture derived analytical projections.'
          if boundary not in evidence:
              evidence = evidence.rstrip() + f'\n\n{boundary}\n'
          write('docs/EVIDENCE-SCHEMA.md', evidence)

          architecture_svg = read('assets/brand/para11ax-readme-architecture-v4.svg')
          architecture_svg = architecture_svg.replace('38 FIXED SOURCES</text><text x="300" y="65"', '38 FIXED SOURCES</text><text x="300" y="70"')
          write('assets/brand/para11ax-readme-architecture-v4.svg', architecture_svg)
          write('assets/brand/para11ax-architecture.svg', architecture_svg)

          semantics = read('assets/brand/para11ax-readme-semantics-v4.svg')
          semantics = semantics.replace('<g transform="translate(26 638)">', '<g transform="translate(26 610)">')
          old_tail = '<g transform="translate(26 746)"><rect width="668" height="52" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".4"/><text x="20" y="34" class="m" font-size="17" fill="#F7FFF6">KEV ≠ EPSS ≠ CVSS · NO LLM · NO SYNTHETIC THREAT SCORE</text></g>'
          new_tail = '<g transform="translate(26 700)"><rect width="668" height="108" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".4"/><text x="350" y="70" class="m" font-size="15" fill="#8DA391">NO LLM · NO SYNTHETIC THREAT SCORE</text><text x="20" y="70" class="m" font-size="17" fill="#F7FFF6">KEV = EXPLOITED</text><text x="20" y="100" class="m" font-size="17" fill="#F7FFF6">EPSS = PROBABILITY</text><text x="350" y="100" class="m" font-size="17" fill="#F7FFF6">CVSS = SEVERITY</text></g>'
          if old_tail not in semantics:
              raise SystemExit('expected semantic footer geometry not found')
          semantics = semantics.replace(old_tail, new_tail)
          write('assets/brand/para11ax-readme-semantics-v4.svg', semantics)

          markdown = subprocess.check_output(['git', 'ls-files', '*.md'], text=True).splitlines()
          for path in sorted(filter(None, markdown)):
              text = read(path)
              if text.startswith(MARKER + '\n'):
                  body = text[len(MARKER) + 1:]
              else:
                  body = text

              if path.startswith('docs/superpowers/') and not re.search(r'Historical design record', body, re.I):
                  body = HISTORICAL + '\n\n' + body.lstrip('\n')

              text = MARKER + '\n' + body.lstrip('\n')

              if 'PΛRΛ11ΛX // PER ASPERA AD ASTRA' not in text:
                  if path == 'README.md' and 'para11ax-radar-lockup.svg' in text:
                      lockup = '<p align="center"><img src="assets/brand/para11ax-radar-lockup.svg" alt="PARA11AX" width="180"></p>'
                      text = text.replace(lockup, FOOTER + '\n\n' + lockup, 1)
                  else:
                      text = text.rstrip() + '\n\n---\n\n' + FOOTER + '\n'

              write(path, text)

          Path('.github/workflows/docs-normalize-once.yml').unlink()
          PY

          git config user.name "ger1e-docs-bot"
          git config user.email "121339626+ger1e@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: standardize every Markdown surface"
          git push origin HEAD:docs/ger1e-normalize-current
