<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="t d"><title id="t">PARA11AX semantic firewall</title><desc id="d">GER1E-normalized semantic firewall separating Evidence v2, deterministic derived intelligence, context, threat evidence, failures and attribution.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020403"/><stop offset=".55" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;letter-spacing:1.4px}</style></defs><rect width="720" height="820" rx="12" fill="url(#bg)"/><rect x="2" y="2" width="716" height="816" rx="12" fill="none" stroke="#39FF14" stroke-opacity=".3"/><g class="m" font-size="15" letter-spacing="1.8" fill="#8DA391"><text x="26" y="30">SEMANTIC FIREWALL</text><text x="694" y="30" text-anchor="end">NO UNIVERSAL SCORE</text></g><path d="M26 48H694" stroke="#39FF14" stroke-opacity=".3"/><g transform="translate(26 68)"><rect width="668" height="98" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".38"/><text x="20" y="30" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">01 // AUTHORITATIVE RECORD</text><text x="20" y="66" class="h" font-size="22" fill="#F7FFF6">EVIDENCE V2 = OBSERVED / NORMALIZED FACTS</text><text x="20" y="91" class="m" font-size="17" fill="#39FF14">provider · parser · timestamps · fingerprints · explicit relationships</text></g><g transform="translate(26 184)"><rect width="668" height="112" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="30" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">02 // DERIVED CONTEXT</text><text x="20" y="66" class="h" font-size="22" fill="#F7FFF6">INTELLIGENCE KERNEL v1.0 ≠ EVIDENCE</text><text x="20" y="94" class="m" font-size="17" fill="#8DA391">strength · diversity · time · contradictions · pivots · priority</text></g><g transform="translate(26 314)"><rect width="668" height="90" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="31" class="h" font-size="22" fill="#39FF14">ABSENCE ≠ BENIGN</text><text x="20" y="64" class="m" font-size="17" fill="#F7FFF6">not found / not listed / no result remain source-scoped absence</text></g><g transform="translate(26 422)"><rect width="668" height="90" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="31" class="h" font-size="22" fill="#39FF14">CONTEXT ≠ REPUTATION</text><text x="20" y="64" class="m" font-size="17" fill="#F7FFF6">routing · registration · Tor · scanner · exposure · certificate · ATT&amp;CK</text></g><g transform="translate(26 530)"><rect width="668" height="90" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="31" class="h" font-size="22" fill="#39FF14">FAILURE ≠ NEGATIVE EVIDENCE</text><text x="20" y="64" class="m" font-size="17" fill="#F7FFF6">timeout · 429 · 5xx · circuit open = coverage limitation</text></g><g transform="translate(26 638)"><rect width="668" height="90" rx="10" fill="#050805" stroke="#FF2438" stroke-opacity=".32"/><text x="20" y="31" class="h" font-size="22" fill="#F7FFF6">INFRASTRUCTURE ≠ ATTRIBUTION</text><text x="20" y="64" class="m" font-size="17" fill="#8DA391">hosting / ASN / DNS / certificate / malware proximity are pivots only</text></g><g transform="translate(26 746)"><rect width="668" height="52" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".4"/><text x="20" y="34" class="m" font-size="17" fill="#F7FFF6">KEV ≠ EPSS ≠ CVSS · NO LLM · NO SYNTHETIC THREAT SCORE</text></g></svg>