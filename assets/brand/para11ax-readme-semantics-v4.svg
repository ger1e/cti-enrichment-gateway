<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="t d"><title id="t">PARA11AX semantic firewall</title><desc id="d">Normalized PARA11AX semantic panel separating observations, context, reputation, vulnerability axes, failures and attribution.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020403"/><stop offset=".52" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;letter-spacing:1.4px}</style></defs><rect width="720" height="820" rx="12" fill="url(#bg)"/><rect x="2" y="2" width="716" height="816" rx="12" fill="none" stroke="#39FF14" stroke-opacity=".26"/><g class="m" font-size="15" letter-spacing="1.8" fill="#8DA391"><text x="26" y="30">SEMANTIC FIREWALL</text><text x="694" y="30" text-anchor="end">EVIDENCE FIRST</text></g><path d="M26 48H694" stroke="#39FF14" stroke-opacity=".3"/><g transform="translate(26 70)"><rect width="668" height="104" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".28"/><text x="20" y="31" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">01 // OBSERVATION</text><text x="20" y="68" class="h" font-size="22" fill="#F7FFF6">PROVIDER FACT → SEMANTIC CLASS</text><text x="20" y="94" class="m" font-size="16" fill="#39FF14">provenance stays attached // failures stay explicit</text></g><g transform="translate(26 194)"><rect width="318" height="178" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".3"/><text x="20" y="31" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">02 // CONTEXT</text><text x="20" y="72" class="h" font-size="20" fill="#F7FFF6">ROUTING · DNS · TOR</text><text x="20" y="103" class="m" font-size="16" fill="#F7FFF6">scanner · certificate</text><text x="20" y="132" class="m" font-size="16" fill="#F7FFF6">ATT&amp;CK knowledge</text><text x="20" y="160" class="m" font-size="15" fill="#39FF14">CONTEXT ≠ REPUTATION</text></g><g transform="translate(376 194)"><rect width="318" height="178" rx="10" fill="#050805" stroke="#FF2438" stroke-opacity=".55"/><text x="20" y="31" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">03 // REPUTATION</text><text x="20" y="72" class="h" font-size="20" fill="#F7FFF6">MALWARE · ABUSE</text><text x="20" y="103" class="m" font-size="16" fill="#F7FFF6">compatible evidence</text><text x="20" y="132" class="m" font-size="16" fill="#F7FFF6">independent sources</text><text x="20" y="160" class="m" font-size="15" fill="#39FF14">CORROBORATE LIKE WITH LIKE</text></g><g transform="translate(26 396)"><rect width="668" height="132" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".28"/><text x="20" y="31" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">04 // VULNERABILITY AXES</text><text x="20" y="72" class="h" font-size="20" fill="#F7FFF6">KEV = EXPLOITED</text><text x="247" y="72" class="h" font-size="20" fill="#F7FFF6">EPSS = PROBABILITY</text><text x="493" y="72" class="h" font-size="20" fill="#F7FFF6">CVSS = SEVERITY</text><text x="20" y="106" class="m" font-size="16" fill="#39FF14">KEEP AXES SEPARATE</text></g><g transform="translate(26 552)"><rect width="668" height="116" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".28"/><text x="20" y="31" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">05 // FAILURE &amp; ATTRIBUTION</text><text x="20" y="70" class="h" font-size="20" fill="#F7FFF6">FAILURE ≠ NEGATIVE EVIDENCE</text><text x="20" y="98" class="m" font-size="16" fill="#F7FFF6">infrastructure proximity ≠ actor attribution</text></g><g transform="translate(26 692)"><rect width="668" height="92" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".52"/><text x="334" y="39" text-anchor="middle" class="h" font-size="22" fill="#39FF14">NO UNIVERSAL MALICIOUSNESS SCORE</text><text x="334" y="69" text-anchor="middle" class="m" font-size="16" fill="#F7FFF6">OBSERVED ≠ INFERRED ≠ CONTEXTUAL</text></g></svg>