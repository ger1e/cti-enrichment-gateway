<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">PARA11AX operating principles and motto</title><desc id="d">GER1E-normalized PARA11AX terminal footer with evidence-first operating principles and Per Aspera Ad Astra.</desc><defs><radialGradient id="bg" cx="50%" cy="60%" r="80%"><stop stop-color="#0b1c0d"/><stop offset=".6" stop-color="#031006"/><stop offset="1" stop-color="#020403"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39FF14" stop-opacity="0"/><stop offset=".5" stop-color="#F7FFF6"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs><rect width="720" height="300" rx="12" fill="url(#bg)"/><rect x="2" y="2" width="716" height="296" rx="12" fill="none" stroke="#39FF14" stroke-opacity=".24"/><text x="28" y="40" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">OPERATING PRINCIPLES</text><text x="692" y="40" text-anchor="end" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">EOF://PARA11AX</text><path d="M28 60H692" stroke="#39FF14" stroke-opacity=".18"/><g class="m" font-size="17"><text x="36" y="104" fill="#F7FFF6"><tspan fill="#39FF14" font-weight="900">01</tspan> EVIDENCE WITHOUT PROVENANCE = A RUMOR</text><text x="36" y="142" fill="#F7FFF6"><tspan fill="#39FF14" font-weight="900">02</tspan> DERIVED INTELLIGENCE WITHOUT TRACEABILITY = GUESSWORK</text><text x="36" y="180" fill="#F7FFF6"><tspan fill="#39FF14" font-weight="900">03</tspan> AUTOMATION WITHOUT BOUNDS = FASTER WRONGNESS</text></g><path d="M120 220H600" stroke="#39FF14" stroke-opacity=".22"/><rect x="120" y="219" width="120" height="3" fill="url(#beam)"><animate attributeName="x" values="120;480;120" dur="9s" repeatCount="indefinite"/></rect><text x="360" y="262" text-anchor="middle" class="m" font-size="22" font-weight="900" letter-spacing="3" fill="#39FF14">PER ASPERA AD ASTRA</text></svg>