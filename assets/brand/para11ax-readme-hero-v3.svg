<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX</title><desc id="desc">PARA11AX README hero with one animated PPI radar and John Kiriakou quote.</desc>
<defs>
<radialGradient id="scope" cx="50%" cy="50%" r="52%"><stop offset="0" stop-color="#0A170C"/><stop offset=".72" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></radialGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39FF14" stop-opacity="0"/><stop offset=".72" stop-color="#39FF14" stop-opacity=".07"/><stop offset="1" stop-color="#39FF14" stop-opacity=".36"/></linearGradient>
</defs>
<style>
.code{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#39FF14;opacity:.12;letter-spacing:3px}.radar-css{transform-box:view-box;transform-origin:330px 260px;animation:radar-spin 9.6s linear infinite}.static-sweep{display:none}@keyframes radar-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.radar-css{display:none}.static-sweep{display:block}.rain{display:none}}
</style>
<rect width="1440" height="520" fill="#020403"/>
<g class="code" aria-hidden="true"><text x="30" y="44">010011010110101101001101101010</text><text x="560" y="84">011010010110110101001011010110</text><text x="1010" y="470">101011001101001011010010110101</text><text x="1180" y="126">001101101001011010011011001010</text></g>
<g transform="translate(330 260)" data-radar="ppi" aria-label="PPI radar">
<circle r="222" fill="url(#scope)" stroke="#39FF14" stroke-width="2" stroke-opacity=".76"/><circle r="211" fill="none" stroke="#39FF14" stroke-opacity=".38" stroke-width="6" stroke-dasharray="1 11"/><circle r="172" fill="none" stroke="#39FF14" stroke-opacity=".24"/><circle r="129" fill="none" stroke="#39FF14" stroke-opacity=".22"/><circle r="86" fill="none" stroke="#39FF14" stroke-opacity=".2"/><circle r="43" fill="none" stroke="#39FF14" stroke-opacity=".18"/>
<g stroke="#39FF14"><path d="M-222 0H222M0-222V222" stroke-opacity=".34"/><path d="M-157-157L157 157M157-157L-157 157" stroke-opacity=".12"/><path d="M0-222v16M0 206v16M-222 0h16M206 0h16" stroke-opacity=".9" stroke-width="2"/></g>
<g fill="#39FF14"><circle cx="104" cy="-116" r="4.6"/><circle cx="-128" cy="85" r="4" fill-opacity=".84"/><circle cx="132" cy="106" r="3.8" fill-opacity=".74"/><circle cx="-61" cy="-139" r="3" fill-opacity=".66"/></g><g fill="#FF2438"><circle cx="-134" cy="-83" r="4.5"/><circle cx="154" cy="43" r="3.7"/></g><circle r="7" fill="#020403" stroke="#F7FFF6" stroke-opacity=".6"/><circle r="2.5" fill="#39FF14"/>
</g>
<g class="radar-css" aria-hidden="true"><g transform="translate(330 260)"><g><path d="M0 0 205-55A212 212 0 0 1 208 40Z" fill="url(#trail)"/><path d="M0 0H211" stroke="#39FF14" stroke-width="2.8" stroke-linecap="round"/><path d="M0-1H211" stroke="#F7FFF6" stroke-opacity=".38" stroke-width=".8"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9.6s" repeatCount="indefinite"/></g></g></g>
<g class="static-sweep" transform="translate(330 260) rotate(34)" aria-hidden="true"><path d="M0 0 205-55A212 212 0 0 1 208 40Z" fill="url(#trail)"/><path d="M0 0H211" stroke="#39FF14" stroke-width="2.8"/></g>
<g transform="translate(730 112)"><text data-wordmark="para11ax-angular-a" aria-label="PARA11AX" font-family="Arial Black,Arial,sans-serif" font-size="96" font-weight="900" letter-spacing="1"><tspan fill="#F7FFF6">PΛRΛ</tspan><tspan fill="#39FF14">11</tspan><tspan fill="#F7FFF6">ΛX</tspan></text><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="0" y="150" fill="#39FF14" font-size="52" font-weight="900">“</text><text x="64" y="146" fill="#F7FFF6" font-size="27">You’ve got to follow the evidence…</text><text x="64" y="192" fill="#F7FFF6" font-size="27">That doesn’t make it fact.</text><text x="64" y="235" fill="#39FF14" font-size="21">— John Kiriakou</text></g><path d="M64 272H610" stroke="#39FF14" stroke-opacity=".38"/></g>
</svg>