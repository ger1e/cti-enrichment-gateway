<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX semantic firewall</title>
<desc id="desc">Terminal-style semantic separation diagram keeping contextual, reputation, claims and vulnerability evidence distinct.</desc>
<rect width="720" height="420" fill="#020403"/>
<rect x="1" y="1" width="718" height="418" fill="none" stroke="#39FF14" stroke-opacity=".34" stroke-width="2"/>
<line x1="1" y1="52" x2="719" y2="52" stroke="#39FF14" stroke-opacity=".24"/>
<text x="24" y="33" fill="#39FF14" font-size="20" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="2">&gt; PARA11AX // SEMANTIC FIREWALL</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="24" y="68" width="672" height="44" fill="#020403" stroke="#39FF14" stroke-opacity=".24"/>
  <text x="42" y="96" fill="#F7FFF6" font-size="16">PROVIDER OBSERVATION → SEMANTIC CLASS → BOUNDED CORRELATION</text>

  <rect x="24" y="136" width="206" height="176" fill="#020403" stroke="#39FF14" stroke-opacity=".5"/>
  <text x="40" y="162" fill="#39FF14" font-size="15" font-weight="700">01 / CONTEXT</text>
  <text x="40" y="194" fill="#F7FFF6" font-size="14">network / routing</text>
  <text x="40" y="218" fill="#F7FFF6" font-size="14">scanner / Tor</text>
  <text x="40" y="242" fill="#F7FFF6" font-size="14">ATT&amp;CK knowledge</text>
  <text x="40" y="266" fill="#F7FFF6" font-size="14">community claims</text>
  <text x="40" y="298" fill="#8DA391" font-size="13">KEEP CONTEXTUAL</text>

  <rect x="257" y="136" width="206" height="176" fill="#020403" stroke="#FF2438" stroke-opacity=".62"/>
  <text x="273" y="162" fill="#FF2438" font-size="15" font-weight="700">02 / REPUTATION</text>
  <text x="273" y="194" fill="#F7FFF6" font-size="14">malware / abuse</text>
  <text x="273" y="218" fill="#F7FFF6" font-size="14">compatible evidence</text>
  <text x="273" y="242" fill="#F7FFF6" font-size="14">independent sources</text>
  <text x="273" y="274" fill="#39FF14" font-size="13">CORROBORATE LIKE</text>
  <text x="273" y="296" fill="#39FF14" font-size="13">WITH LIKE ONLY</text>

  <rect x="490" y="136" width="206" height="176" fill="#020403" stroke="#39FF14" stroke-opacity=".34"/>
  <text x="506" y="162" fill="#39FF14" font-size="15" font-weight="700">03 / VULN AXES</text>
  <text x="506" y="198" fill="#F7FFF6" font-size="14">KEV = exploited</text>
  <text x="506" y="224" fill="#F7FFF6" font-size="14">EPSS = probability</text>
  <text x="506" y="250" fill="#F7FFF6" font-size="14">CVSS = severity</text>
  <text x="506" y="296" fill="#8DA391" font-size="13">KEEP AXES SEPARATE</text>

  <rect x="24" y="340" width="672" height="50" fill="#020403" stroke="#39FF14" stroke-opacity=".52"/>
  <text x="360" y="371" fill="#39FF14" font-size="16" font-weight="700" text-anchor="middle">NO UNIVERSAL MALICIOUSNESS SCORE</text>
</g>
</svg>