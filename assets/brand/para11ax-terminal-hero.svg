<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">PARA11AX</title>
  <desc id="desc">Dark Matrix-style PARA11AX banner with one animated radar and the John Kiriakou quote.</desc>
  <defs>
    <radialGradient id="scope-bg" cx="50%" cy="50%" r="52%"><stop offset="0" stop-color="#0A170C"/><stop offset=".72" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39FF14" stop-opacity="0"/><stop offset=".7" stop-color="#39FF14" stop-opacity=".06"/><stop offset="1" stop-color="#39FF14" stop-opacity=".34"/></linearGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#39FF14" stop-opacity=".32"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .motion{display:block}.static-sweep{display:none}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#39FF14;opacity:.14;letter-spacing:3px}
    @media(prefers-reduced-motion: reduce){.motion{display:none}.static-sweep{display:block}.rain-move{display:none}}
  </style>
  <rect width="1440" height="520" fill="#020403"/>
  <rect width="1440" height="520" fill="url(#fade)" opacity=".09"/>

  <g class="code" aria-hidden="true">
    <g><text x="34" y="0">010011010110101101001101101010</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -140" to="0 560" dur="18s" repeatCount="indefinite"/></g>
    <g opacity=".72"><text x="160" y="0">110101100101110010101101001101</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -280" to="0 560" dur="21s" repeatCount="indefinite"/></g>
    <g><text x="292" y="0">001101011010011010110010110100</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -80" to="0 560" dur="17s" repeatCount="indefinite"/></g>
    <g opacity=".65"><text x="428" y="0">101100101101001110100110101001</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -360" to="0 560" dur="23s" repeatCount="indefinite"/></g>
    <g><text x="568" y="0">011010010110110101001011010110</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -190" to="0 560" dur="19s" repeatCount="indefinite"/></g>
    <g opacity=".7"><text x="706" y="0">100101101001101100101101001011</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -310" to="0 560" dur="22s" repeatCount="indefinite"/></g>
    <g><text x="842" y="0">011001011010010110110010101101</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -120" to="0 560" dur="16s" repeatCount="indefinite"/></g>
    <g opacity=".62"><text x="982" y="0">101011001101001011010010110101</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -390" to="0 560" dur="23s" repeatCount="indefinite"/></g>
    <g><text x="1118" y="0">001101101001011010011011001010</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -220" to="0 560" dur="20s" repeatCount="indefinite"/></g>
    <g opacity=".72"><text x="1260" y="0">110010110100101101001101011001</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -60" to="0 560" dur="17.5s" repeatCount="indefinite"/></g>
  </g>

  <g transform="translate(330 260)" data-radar="ppi" aria-label="radar">
    <circle r="222" fill="url(#scope-bg)" stroke="#39FF14" stroke-width="2" stroke-opacity=".72"/>
    <circle r="211" fill="none" stroke="#39FF14" stroke-opacity=".42" stroke-width="7" stroke-dasharray="1 11.3"/>
    <circle r="172" fill="none" stroke="#39FF14" stroke-opacity=".24"/>
    <circle r="129" fill="none" stroke="#39FF14" stroke-opacity=".22"/>
    <circle r="86" fill="none" stroke="#39FF14" stroke-opacity=".2"/>
    <circle r="43" fill="none" stroke="#39FF14" stroke-opacity=".18"/>
    <g id="crosshair" stroke="#39FF14"><path d="M-222 0H222M0-222V222" stroke-opacity=".36"/><path d="M0-222v16M0 206v16M-222 0h16M206 0h16" stroke-opacity=".92" stroke-width="2"/></g>
    <g fill="#39FF14"><circle cx="104" cy="-116" r="4.6"/><circle cx="-128" cy="85" r="4" fill-opacity=".84"/><circle cx="132" cy="106" r="3.8" fill-opacity=".74"/><circle cx="-61" cy="-139" r="3" fill-opacity=".66"/></g>
    <g fill="#FF2438"><circle cx="-134" cy="-83" r="4.5"/><circle cx="154" cy="43" r="3.7"/></g>
    <g class="motion"><path d="M0 0 205-55A212 212 0 0 1 208 40Z" fill="url(#sweep)"/><path d="M0 0H211" stroke="#39FF14" stroke-width="2.7" stroke-linecap="round"/><path d="M0-1H211" stroke="#F7FFF6" stroke-opacity=".36" stroke-width=".8"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite"/></g>
    <g class="static-sweep" transform="rotate(34)"><path d="M0 0 205-55A212 212 0 0 1 208 40Z" fill="url(#sweep)"/><path d="M0 0H211" stroke="#39FF14" stroke-width="2.7"/></g>
    <circle r="7" fill="#020403" stroke="#F7FFF6" stroke-opacity=".6"/><circle r="2.5" fill="#39FF14"/>
  </g>

  <g transform="translate(730 112)">
    <text data-wordmark="para11ax-angular-a" aria-label="PARA11AX" font-family="Arial Black,Arial,sans-serif" font-size="96" font-weight="900" letter-spacing="1"><tspan fill="#F7FFF6">PΛRΛ</tspan><tspan fill="#39FF14">11</tspan><tspan fill="#F7FFF6">ΛX</tspan></text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <text x="0" y="150" fill="#39FF14" font-size="52" font-weight="900">“</text>
      <text x="64" y="146" fill="#F7FFF6" font-size="27">You’ve got to follow the evidence…</text>
      <text x="64" y="192" fill="#F7FFF6" font-size="27">That doesn’t make it fact.</text>
      <text x="64" y="235" fill="#39FF14" font-size="21">— John Kiriakou</text>
    </g>
    <path d="M64 272H610" stroke="#39FF14" stroke-opacity=".38"/>
    <circle cx="336" cy="272" r="3" fill="#39FF14"/>
  </g>
</svg>
