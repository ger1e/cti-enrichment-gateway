<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX — CTI Evidence Gateway</title>
<desc id="desc">Animated phosphor radar and Matrix-rain repository banner for PARA11AX with provenance-first doctrine and a John Kiriakou evidence quote.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#010302"/><stop offset=".52" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></linearGradient>
  <radialGradient id="rg"><stop stop-color="#39FF14" stop-opacity=".14"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#39FF14" stroke-opacity=".035"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="2" y="2" width="1436" height="476" rx="26"/></clipPath>
  <g id="col" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700"><text y="0">P</text><text y="14">A</text><text y="28">R</text><text y="42">A</text><text y="56">1</text><text y="70">1</text><text y="84">A</text><text y="98">X</text><text y="112">0</text><text y="126">1</text><text y="140">E</text><text y="154">V</text><text y="168">2</text><text y="182">S</text><text y="196">T</text><text y="210">I</text><text y="224">X</text><text y="238">C</text><text y="252">T</text><text y="266">I</text></g>
  <g id="redcol" fill="#FF2438" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="800"><text y="0">A</text><text y="14">N</text><text y="28">O</text><text y="42">M</text><text y="56">A</text><text y="70">L</text><text y="84">Y</text><text y="98">1</text><text y="112">0</text><text y="126">1</text></g>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.g{fill:#39FF14}.w{fill:#F7FFF6}.m{fill:#8DA391}.motion{display:block}.static{display:none}.cursor{animation:blink .9s steps(1,end) infinite}.pulse{animation:pulse 1.7s ease-in-out infinite}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.28}}@media(prefers-reduced-motion:reduce){.motion{display:none}.static{display:block}.cursor,.pulse{animation:none}}</style>
</defs>
<rect width="1440" height="480" rx="28" fill="url(#bg)"/><rect width="1440" height="480" rx="28" fill="url(#grid)"/>
<g clip-path="url(#clip)" opacity=".18"><use href="#col" x="18" y="28"/><use href="#col" x="58" y="-96" opacity=".45"/><use href="#col" x="98" y="82"/><use href="#col" x="138" y="-34" opacity=".5"/><use href="#redcol" x="178" y="48" opacity=".5"/><use href="#col" x="218" y="-122"/><use href="#col" x="258" y="62" opacity=".55"/><use href="#col" x="298" y="-52"/><use href="#col" x="338" y="102" opacity=".45"/><use href="#col" x="378" y="-18"/><use href="#col" x="418" y="40"/><use href="#col" x="458" y="-104" opacity=".45"/><use href="#col" x="498" y="74"/><use href="#col" x="538" y="-44" opacity=".54"/><use href="#redcol" x="578" y="92" opacity=".34"/><use href="#col" x="618" y="-78"/><use href="#col" x="658" y="28" opacity=".5"/><use href="#col" x="698" y="-128"/><use href="#col" x="738" y="86" opacity=".47"/><use href="#col" x="778" y="-10"/><use href="#col" x="818" y="50"/><use href="#col" x="858" y="-94" opacity=".52"/><use href="#col" x="898" y="104"/><use href="#col" x="938" y="-30" opacity=".46"/><use href="#redcol" x="978" y="64" opacity=".35"/><use href="#col" x="1018" y="-116"/><use href="#col" x="1058" y="22" opacity=".48"/><use href="#col" x="1098" y="-58"/><use href="#col" x="1138" y="98" opacity=".54"/><use href="#col" x="1178" y="-20"/><use href="#col" x="1218" y="56"/><use href="#col" x="1258" y="-106" opacity=".49"/><use href="#col" x="1298" y="88"/><use href="#col" x="1338" y="-40" opacity=".54"/><use href="#redcol" x="1378" y="36" opacity=".4"/></g>
<g class="motion" clip-path="url(#clip)" opacity=".34"><use href="#col" x="74"><animateTransform attributeName="transform" type="translate" values="0 -330;0 550" dur="2.7s" begin="-1.7s" repeatCount="indefinite"/></use><use href="#col" x="274"><animateTransform attributeName="transform" type="translate" values="0 -350;0 550" dur="3.5s" begin="-.9s" repeatCount="indefinite"/></use><use href="#redcol" x="474" opacity=".5"><animateTransform attributeName="transform" type="translate" values="0 -250;0 550" dur="3s" begin="-2.1s" repeatCount="indefinite"/></use><use href="#col" x="674"><animateTransform attributeName="transform" type="translate" values="0 -360;0 550" dur="2.5s" begin="-1.2s" repeatCount="indefinite"/></use><use href="#col" x="874"><animateTransform attributeName="transform" type="translate" values="0 -340;0 550" dur="3.3s" begin="-2.4s" repeatCount="indefinite"/></use><use href="#redcol" x="1074" opacity=".45"><animateTransform attributeName="transform" type="translate" values="0 -260;0 550" dur="2.8s" begin="-.6s" repeatCount="indefinite"/></use><use href="#col" x="1274"><animateTransform attributeName="transform" type="translate" values="0 -355;0 550" dur="3.1s" begin="-1.9s" repeatCount="indefinite"/></use></g>
<rect x="2" y="2" width="1436" height="476" rx="26" fill="none" stroke="#39FF14" stroke-opacity=".27" stroke-width="3"/>
<g transform="translate(34 24)" class="mono"><g transform="translate(28 28)"><circle r="24" fill="#020403" stroke="#39FF14" stroke-opacity=".62" stroke-width="1.4"/><circle r="16" fill="none" stroke="#39FF14" stroke-opacity=".34"/><circle r="8" fill="none" stroke="#39FF14" stroke-opacity=".24"/><path d="M-24 0H24M0-24V24" stroke="#39FF14" stroke-opacity=".16"/><g class="motion"><path d="M0 0 22-6A23 23 0 0 1 22 6Z" fill="#39FF14" fill-opacity=".12"/><path d="M0 0H23" stroke="#39FF14" stroke-width="1.8"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.4s" repeatCount="indefinite"/></g><g class="static" transform="rotate(28)"><path d="M0 0 22-6A23 23 0 0 1 22 6Z" fill="#39FF14" fill-opacity=".12"/><path d="M0 0H23" stroke="#39FF14" stroke-width="1.8"/></g><circle cx="12" cy="-10" r="2" fill="#39FF14"/><circle cx="-9" cy="11" r="1.7" fill="#39FF14" fill-opacity=".72"/><circle cx="17" cy="13" r="1.8" fill="#FF2438"/></g><text x="68" y="37" font-size="23" font-weight="900" letter-spacing="2.4"><tspan class="w">PARA</tspan><tspan class="g">11</tspan><tspan class="w">AX</tspan></text><text x="505" y="36" class="m" font-size="12" letter-spacing="1.8">LINK: UP // AUTH: UP // SYS: NOMINAL</text><circle cx="817" cy="31" r="4" fill="#39FF14" class="pulse"/><text x="1360" y="36" class="g" font-size="12" text-anchor="end" letter-spacing="1.5">PROVENANCE-FIRST // READ-ONLY</text></g>
<g transform="translate(86 112)" class="mono"><text x="0" y="76" font-size="88" font-weight="900" letter-spacing="5"><tspan class="w">PARA</tspan><tspan class="g" filter="url(#glow)">11</tspan><tspan class="w">AX</tspan></text><text x="3" y="115" class="g" font-size="18" font-weight="800" letter-spacing="5">CTI // EVIDENCE GATEWAY</text><text x="3" y="149" class="m" font-size="13" font-weight="700" letter-spacing="2.7">INTELLIGENCE. ENRICHED. OPERATIONAL.</text><path d="M3 174h704" stroke="#39FF14" stroke-opacity=".22"/><text x="3" y="206" class="g" font-size="13" font-weight="800" letter-spacing="2">SEMANTIC FIREWALL // EVIDENCE FIRST</text><text x="3" y="245" class="w" font-size="14">“You’ve got to follow the evidence… That doesn’t make it fact.”</text><text x="3" y="270" class="m" font-size="11" letter-spacing="2">— JOHN KIRIAKOU</text><text x="3" y="325" class="g" font-size="13">analyst@para11ax:~$</text><rect x="190" y="313" width="9" height="16" fill="#39FF14" class="cursor"/></g>
<g transform="translate(1080 250)"><circle r="178" fill="url(#rg)"/><circle r="150" fill="#020403" fill-opacity=".84" stroke="#39FF14" stroke-opacity=".42" stroke-width="2"/><circle r="112" fill="none" stroke="#39FF14" stroke-opacity=".18"/><circle r="75" fill="none" stroke="#39FF14" stroke-opacity=".15"/><circle r="38" fill="none" stroke="#39FF14" stroke-opacity=".13"/><path d="M-150 0H150M0-150V150M-106-106 106 106M106-106-106 106" stroke="#39FF14" stroke-opacity=".1"/><g class="motion"><path d="M0 0 144-39A149 149 0 0 1 149 0Z" fill="#39FF14" fill-opacity=".07"/><path d="M0 0H149" stroke="#39FF14" stroke-width="2" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></g><g class="static" transform="rotate(26)"><path d="M0 0 144-39A149 149 0 0 1 149 0Z" fill="#39FF14" fill-opacity=".07"/><path d="M0 0H149" stroke="#39FF14" stroke-width="2"/></g><circle cx="72" cy="-61" r="5" fill="#39FF14" filter="url(#glow)"/><circle cx="-64" cy="76" r="4" fill="#39FF14"/><circle cx="102" cy="62" r="4" fill="#FF2438"/><circle cx="-93" cy="-35" r="3" fill="#39FF14" fill-opacity=".7"/><circle r="5" fill="#39FF14"/><g class="mono" font-size="10" font-weight="700" letter-spacing="1.3"><text x="82" y="-69" class="g">IOC</text><text x="-116" y="91" class="m">CTX</text><text x="112" y="78" fill="#FF2438">ANOMALY</text><text x="-126" y="-48" class="m">SRC</text></g></g>
<g class="mono" font-size="11" font-weight="800" letter-spacing="1.9"><text x="88" y="446" class="g">38 FIXED SOURCES</text><text x="264" y="446" class="m">//</text><text x="298" y="446" class="w">EVIDENCE V2</text><text x="444" y="446" class="m">//</text><text x="478" y="446" class="w">STIX 2.1</text><text x="584" y="446" class="m">//</text><text x="618" y="446" class="m">READ-ONLY</text><text x="738" y="446" class="m">//</text><text x="772" y="446" class="m">FIXED EGRESS</text><text x="1360" y="446" class="g" text-anchor="end">OBSERVED ≠ INFERRED ≠ CONTEXTUAL</text></g>
</svg>