<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX mobile terminal hero</title>
<desc id="desc">Compact phosphor terminal identity with analyst prompt for narrow GitHub surfaces.</desc>
<style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.g{fill:#39FF14}.w{fill:#F7FFF6}.m{fill:#8DA391}.cursor{animation:blink .9s steps(1,end) infinite}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.cursor,.pulse{animation:none}}</style>
<rect width="720" height="360" fill="#020403"/>
<rect x="10" y="10" width="700" height="340" fill="none" stroke="#39FF14" stroke-opacity=".38"/>
<rect x="10" y="10" width="700" height="42" fill="#020403" stroke="#39FF14" stroke-opacity=".26"/>
<text x="28" y="37" class="mono g" font-size="17" font-weight="700" letter-spacing="3">PARA11AX</text>
<text x="690" y="37" class="mono g" font-size="12" text-anchor="end">LINK:UP · AUTH:UP · <tspan class="pulse">●</tspan></text>
<g class="mono"><text x="36" y="107" class="g" font-size="48" font-weight="900" letter-spacing="3">PARA11AX</text><text x="38" y="137" class="g" font-size="13" letter-spacing="3">PROVENANCE-FIRST CTI</text><text x="38" y="174" class="m" font-size="13">37 FIXED SOURCES // READ-ONLY // FIXED EGRESS</text></g>
<rect x="34" y="200" width="652" height="118" fill="#020403" stroke="#39FF14" stroke-opacity=".46"/>
<g class="mono" font-size="14"><text x="52" y="226" class="g">&gt; PARA11AX TERMINAL v2.0.0</text><text x="52" y="260" class="g">analyst@para11ax:~$ whoami</text><text x="52" y="284" class="w">Threat Hunter</text><text x="52" y="308" class="g">analyst@para11ax:~$</text><rect x="253" y="296" width="9" height="15" fill="#39FF14" class="cursor"/></g>
<line x1="34" y1="332" x2="686" y2="332" stroke="#39FF14" stroke-opacity=".18"/>
</svg>