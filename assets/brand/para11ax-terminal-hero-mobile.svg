<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">PARA11AX</title>
  <desc id="desc">Dark Matrix-style PARA11AX mobile banner with one animated radar and the John Kiriakou quote.</desc>
  <defs>
    <radialGradient id="scope-bg" cx="50%" cy="50%" r="52%"><stop offset="0" stop-color="#0A170C"/><stop offset=".72" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39FF14" stop-opacity="0"/><stop offset=".7" stop-color="#39FF14" stop-opacity=".06"/><stop offset="1" stop-color="#39FF14" stop-opacity=".34"/></linearGradient>
  </defs>
  <style>
    .motion{display:block}.static-sweep{display:none}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#39FF14;opacity:.13;letter-spacing:2px}
    @media(prefers-reduced-motion: reduce){.motion{display:none}.static-sweep{display:block}.rain-move{display:none}}
  </style>
  <rect width="720" height="900" fill="#020403"/>
  <g class="code" aria-hidden="true">
    <g><text x="22" y="0">0101101010011010110010110101</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -160" to="0 940" dur="18s" repeatCount="indefinite"/></g>
    <g opacity=".7"><text x="132" y="0">1010011011010010110101100101</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -360" to="0 940" dur="22s" repeatCount="indefinite"/></g>
    <g><text x="246" y="0">0011010110100110101100101101</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -80" to="0 940" dur="17s" repeatCount="indefinite"/></g>
    <g opacity=".66"><text x="360" y="0">1100101101001101100101101001</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -430" to="0 940" dur="23s" repeatCount="indefinite"/></g>
    <g><text x="474" y="0">0110100101101101001011010011</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -230" to="0 940" dur="19s" repeatCount="indefinite"/></g>
    <g opacity=".72"><text x="588" y="0">1011010010110100110101100101</text><animateTransform class="rain-move" attributeName="transform" type="translate" from="0 -110" to="0 940" dur="16.5s" repeatCount="indefinite"/></g>
  </g>

  <text x="360" y="108" text-anchor="middle" data-wordmark="para11ax-angular-a" aria-label="PARA11AX" font-family="Arial Black,Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="1"><tspan fill="#F7FFF6">PΛRΛ</tspan><tspan fill="#39FF14">11</tspan><tspan fill="#F7FFF6">ΛX</tspan></text>

  <g transform="translate(360 400)" data-radar="ppi" aria-label="radar">
    <circle r="238" fill="url(#scope-bg)" stroke="#39FF14" stroke-width="2" stroke-opacity=".72"/>
    <circle r="226" fill="none" stroke="#39FF14" stroke-opacity=".42" stroke-width="7" stroke-dasharray="1 12"/>
    <circle r="184" fill="none" stroke="#39FF14" stroke-opacity=".24"/>
    <circle r="138" fill="none" stroke="#39FF14" stroke-opacity=".22"/>
    <circle r="92" fill="none" stroke="#39FF14" stroke-opacity=".2"/>
    <circle r="46" fill="none" stroke="#39FF14" stroke-opacity=".18"/>
    <g id="crosshair" stroke="#39FF14"><path d="M-238 0H238M0-238V238" stroke-opacity=".36"/><path d="M0-238v17M0 221v17M-238 0h17M221 0h17" stroke-opacity=".92" stroke-width="2"/></g>
    <g fill="#39FF14"><circle cx="112" cy="-124" r="4.8"/><circle cx="-137" cy="91" r="4.2" fill-opacity=".84"/><circle cx="142" cy="114" r="4" fill-opacity=".74"/><circle cx="-66" cy="-149" r="3.2" fill-opacity=".66"/></g>
    <g fill="#FF2438"><circle cx="-144" cy="-89" r="4.7"/><circle cx="165" cy="46" r="3.9"/></g>
    <g class="motion"><path d="M0 0 220-59A228 228 0 0 1 223 43Z" fill="url(#sweep)"/><path d="M0 0H227" stroke="#39FF14" stroke-width="2.8" stroke-linecap="round"/><path d="M0-1H227" stroke="#F7FFF6" stroke-opacity=".36" stroke-width=".8"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite"/></g>
    <g class="static-sweep" transform="rotate(34)"><path d="M0 0 220-59A228 228 0 0 1 223 43Z" fill="url(#sweep)"/><path d="M0 0H227" stroke="#39FF14" stroke-width="2.8"/></g>
    <circle r="8" fill="#020403" stroke="#F7FFF6" stroke-opacity=".6"/><circle r="2.8" fill="#39FF14"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="78" y="710" fill="#39FF14" font-size="48" font-weight="900">“</text>
    <text x="126" y="710" fill="#F7FFF6" font-size="24">You’ve got to follow</text>
    <text x="126" y="752" fill="#F7FFF6" font-size="24">the evidence…</text>
    <text x="126" y="794" fill="#F7FFF6" font-size="24">That doesn’t make it fact.</text>
    <text x="126" y="838" fill="#39FF14" font-size="20">— John Kiriakou</text>
  </g>
  <path d="M126 864H594" stroke="#39FF14" stroke-opacity=".36"/><circle cx="360" cy="864" r="3" fill="#39FF14"/>
</svg>
