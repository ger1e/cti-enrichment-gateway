<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX mobile repository banner</title>
<desc id="desc">Compact animated radar and Matrix-rain banner for PARA11AX with John Kiriakou evidence quote.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#010302"/><stop offset=".55" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <g id="col" fill="#39FF14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700"><text y="0">P</text><text y="13">A</text><text y="26">R</text><text y="39">A</text><text y="52">1</text><text y="65">1</text><text y="78">A</text><text y="91">X</text><text y="104">E</text><text y="117">V</text><text y="130">2</text><text y="143">S</text><text y="156">T</text><text y="169">I</text><text y="182">X</text></g>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.g{fill:#39FF14}.w{fill:#F7FFF6}.m{fill:#8DA391}.motion{display:block}.static{display:none}.pulse{animation:pulse 1.7s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.motion{display:none}.static{display:block}.pulse{animation:none}}</style>
</defs>
<rect width="720" height="420" rx="18" fill="url(#bg)"/>
<g opacity=".16"><use href="#col" x="18" y="22"/><use href="#col" x="58" y="-70"/><use href="#col" x="98" y="80"/><use href="#col" x="138" y="-28"/><use href="#col" x="178" y="46"/><use href="#col" x="218" y="-92"/><use href="#col" x="258" y="64"/><use href="#col" x="298" y="-44"/><use href="#col" x="338" y="92"/><use href="#col" x="378" y="-18"/><use href="#col" x="418" y="40"/><use href="#col" x="458" y="-78"/><use href="#col" x="498" y="74"/><use href="#col" x="538" y="-36"/><use href="#col" x="578" y="58"/><use href="#col" x="618" y="-84"/><use href="#col" x="658" y="90"/></g>
<g class="motion" opacity=".32"><use href="#col" x="86"><animateTransform attributeName="transform" type="translate" values="0 -210;0 460" dur="2.7s" begin="-1.3s" repeatCount="indefinite"/></use><use href="#col" x="326"><animateTransform attributeName="transform" type="translate" values="0 -230;0 460" dur="3.2s" begin="-.7s" repeatCount="indefinite"/></use><use href="#col" x="566"><animateTransform attributeName="transform" type="translate" values="0 -220;0 460" dur="2.9s" begin="-2s" repeatCount="indefinite"/></use></g>
<rect x="2" y="2" width="716" height="416" rx="16" fill="none" stroke="#39FF14" stroke-opacity=".28" stroke-width="2"/>
<g transform="translate(24 18)" class="mono"><g transform="translate(22 22)"><circle r="20" fill="#020403" stroke="#39FF14" stroke-opacity=".62"/><circle r="13" fill="none" stroke="#39FF14" stroke-opacity=".3"/><path d="M-20 0H20M0-20V20" stroke="#39FF14" stroke-opacity=".15"/><g class="motion"><path d="M0 0H19" stroke="#39FF14" stroke-width="1.7"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.4s" repeatCount="indefinite"/></g><g class="static" transform="rotate(28)"><path d="M0 0H19" stroke="#39FF14" stroke-width="1.7"/></g><circle cx="10" cy="-8" r="1.8" fill="#39FF14"/><circle cx="14" cy="11" r="1.7" fill="#FF2438"/></g><text x="54" y="30" font-size="21" font-weight="900" letter-spacing="2"><tspan class="w">PARA</tspan><tspan class="g">11</tspan><tspan class="w">AX</tspan></text><text x="665" y="30" class="g" font-size="10" text-anchor="end">LINK:UP // <tspan class="pulse">●</tspan></text></g>
<g class="mono"><text x="34" y="118" font-size="54" font-weight="900" letter-spacing="3"><tspan class="w">PARA</tspan><tspan class="g" filter="url(#glow)">11</tspan><tspan class="w">AX</tspan></text><text x="36" y="148" class="g" font-size="12" font-weight="800" letter-spacing="3">CTI // EVIDENCE GATEWAY</text><text x="36" y="173" class="m" font-size="10" letter-spacing="1.8">INTELLIGENCE. ENRICHED. OPERATIONAL.</text></g>
<g transform="translate(546 150)"><circle r="92" fill="#020403" fill-opacity=".82" stroke="#39FF14" stroke-opacity=".4"/><circle r="68" fill="none" stroke="#39FF14" stroke-opacity=".18"/><circle r="44" fill="none" stroke="#39FF14" stroke-opacity=".14"/><path d="M-92 0H92M0-92V92" stroke="#39FF14" stroke-opacity=".1"/><g class="motion"><path d="M0 0H90" stroke="#39FF14" stroke-width="2" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></g><g class="static" transform="rotate(26)"><path d="M0 0H90" stroke="#39FF14" stroke-width="2"/></g><circle cx="42" cy="-38" r="4" fill="#39FF14"/><circle cx="-38" cy="46" r="3" fill="#39FF14"/><circle cx="59" cy="36" r="3" fill="#FF2438"/></g>
<g class="mono"><path d="M34 208h420" stroke="#39FF14" stroke-opacity=".22"/><text x="34" y="238" class="g" font-size="11" font-weight="800" letter-spacing="1.7">SEMANTIC FIREWALL // EVIDENCE FIRST</text><text x="34" y="274" class="w" font-size="12">“You’ve got to follow the evidence…</text><text x="34" y="294" class="w" font-size="12">That doesn’t make it fact.”</text><text x="34" y="318" class="m" font-size="9" letter-spacing="1.7">— JOHN KIRIAKOU</text></g>
<g class="mono" font-size="9" font-weight="800" letter-spacing="1.3"><text x="34" y="374" class="g">38 FIXED SOURCES</text><text x="162" y="374" class="m">//</text><text x="184" y="374" class="w">EVIDENCE V2</text><text x="284" y="374" class="m">//</text><text x="306" y="374" class="w">STIX 2.1</text><text x="380" y="374" class="m">//</text><text x="402" y="374" class="m">READ-ONLY</text></g><text x="34" y="400" class="mono g" font-size="9" letter-spacing="1.4">OBSERVED ≠ INFERRED ≠ CONTEXTUAL</text>
</svg>