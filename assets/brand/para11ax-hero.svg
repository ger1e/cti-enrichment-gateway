</g>
<rect x="2" y="2" width="1436" height="476" rx="26" fill="none" stroke="#00E5FF" stroke-opacity=".24" stroke-width="3"/>
<g transform="translate(60 72)"><path d="M12 24 132 168 12 312M292 24 172 168 292 312" fill="none" stroke="#00E5FF" stroke-width="14" filter="url(#cg)"/><path d="M58 24 152 134 246 24M58 312 152 202 246 312" fill="none" stroke="#F3F7FA" stroke-width="4" opacity=".15"/><path d="M32 168H272M152 52V284" stroke="#00E5FF" stroke-width="2" stroke-dasharray="5 12" opacity=".22"/><circle cx="152" cy="168" r="31" fill="#FF1E2D" opacity=".16" filter="url(#rg)"/><circle cx="152" cy="168" r="11" fill="#FF4050" filter="url(#rg)"/><circle cx="152" cy="168" r="3" fill="#fff"/><text x="8" y="350" fill="#9AA6AE" font-size="12" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">OBSERVATION NODE // 01</text></g>
<g transform="translate(405 76)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="0" y="95" font-size="98" font-weight="900" letter-spacing="7"><tspan fill="#F3F7FA">PARA</tspan><tspan fill="#00E5FF">11</tspan><tspan fill="#F3F7FA">AX</tspan></text><rect x="302" y="11" width="13" height="94" rx="3" fill="#00E5FF" opacity=".12"/><rect x="354" y="11" width="13" height="94" rx="3" fill="#00E5FF" opacity=".12"/><text x="4" y="139" fill="#00E5FF" font-size="20" font-weight="800" letter-spacing="6">CTI // EVIDENCE GATEWAY</text><text x="4" y="177" fill="#A2ADB5" font-size="15" font-weight="700" letter-spacing="3.4">BOUNDED · READ-ONLY · PROVENANCE-FIRST</text><g transform="translate(4 212)"><rect width="720" height="1" fill="#00E5FF" opacity=".22"/><circle cx="8" cy="27" r="4" fill="#39FF88"/><text x="22" y="32" fill="#39FF88" font-size="12" font-weight="800" letter-spacing="2.2">EVIDENCE STATE // VERIFIED</text><text x="0" y="72" fill="#C0C8CE" font-size="15">“You’ve got to follow the <tspan fill="#00E5FF" font-weight="800">evidence</tspan>… That doesn’t make it <tspan fill="#F3F7FA" font-weight="800">fact</tspan>.”</text><text x="0" y="98" fill="#A2ADB5" font-size="13" letter-spacing="1.7">— JOHN KIRIAKOU</text></g></g>
<g transform="translate(408 382)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><rect width="880" height="34" rx="17" fill="#100205" stroke="#FF1E2D" stroke-opacity=".44"/><rect x="18" y="14" width="844" height="6" rx="3" fill="#39080D"/><g filter="url(#rg)"><rect x="18" y="9" width="150" height="16" rx="8" fill="url(#tail)"><animate attributeName="x" values="18;710;18" dur="1.8s" repeatCount="indefinite"/></rect><rect x="150" y="7" width="18" height="20" rx="9" fill="#FF4050"><animate attributeName="x" values="150;842;150" dur="1.8s" repeatCount="indefinite"/></rect></g><text x="0" y="58" fill="#9AA6AE" font-size="11" letter-spacing="2.5">ACTIVE OBSERVATION // CORRELATE WITHOUT COLLAPSING SEMANTICS</text></g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2.4"><text x="1280" y="52" fill="#00E5FF">37 SOURCES</text><text x="1280" y="73" fill="#39FF88">EVIDENCE V2</text><text x="1280" y="94" fill="#A2ADB5">STIX 2.1</text></g>
