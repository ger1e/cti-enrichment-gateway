<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX — CTI Evidence Gateway</title>
<desc id="desc">Black-glass PARA11AX CTI banner with persistent and animated dense red code rain, cyan observation geometry, red scanner, evidence-state accents, and the John Kiriakou evidence quotation.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020305"/><stop offset=".5" stop-color="#080D11"/><stop offset="1" stop-color="#020305"/></linearGradient>
<linearGradient id="tail"><stop stop-color="#FF1E2D" stop-opacity="0"/><stop offset=".7" stop-color="#FF1E2D" stop-opacity=".68"/><stop offset="1" stop-color="#FF4050"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00E5FF" opacity=".035"/></pattern>
<filter id="cg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="rg" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect x="2" y="2" width="1436" height="476" rx="26"/></clipPath>
<g id="r1" fill="#FF1E2D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800"><text y="0">7</text><text y="18">0</text><text y="36">A</text><text y="54">1</text><text y="72">X</text><text y="90">9</text><text y="108">3</text><text y="126">F</text><text y="144">0</text><text y="162">1</text><text y="180">D</text><text y="198">8</text><text y="216">K</text><text y="234">2</text><text y="252">5</text><text y="270">E</text><text y="288">0</text><text y="306">7</text><text y="324">C</text></g>
<g id="r2" fill="#FF4050" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700"><text y="0">1</text><text y="17">B</text><text y="34">4</text><text y="51">0</text><text y="68">9</text><text y="85">Z</text><text y="102">6</text><text y="119">2</text><text y="136">Q</text><text y="153">8</text><text y="170">1</text><text y="187">0</text><text y="204">V</text><text y="221">3</text><text y="238">7</text><text y="255">A</text><text y="272">5</text><text y="289">1</text><text y="306">C</text><text y="323">0</text></g>
</defs>
<rect width="1440" height="480" rx="28" fill="url(#bg)"/><rect width="1440" height="480" rx="28" fill="url(#grid)"/>
<g clip-path="url(#clip)">
<g opacity=".19"><use href="#r1" x="18" y="40"/><use href="#r2" x="66" y="-20"/><use href="#r1" x="114" y="10"/><use href="#r2" x="162" y="55"/><use href="#r1" x="210" y="-35"/><use href="#r2" x="258" y="25"/><use href="#r1" x="306" y="65"/><use href="#r2" x="354" y="0"/><use href="#r1" x="402" y="35"/><use href="#r2" x="450" y="-15"/><use href="#r1" x="498" y="50"/><use href="#r2" x="546" y="15"/><use href="#r1" x="594" y="-30"/><use href="#r2" x="642" y="45"/><use href="#r1" x="690" y="5"/><use href="#r2" x="738" y="60"/><use href="#r1" x="786" y="-10"/><use href="#r2" x="834" y="30"/><use href="#r1" x="882" y="70"/><use href="#r2" x="930" y="-25"/><use href="#r1" x="978" y="20"/><use href="#r2" x="1026" y="50"/><use href="#r1" x="1074" y="0"/><use href="#r2" x="1122" y="65"/><use href="#r1" x="1170" y="-20"/><use href="#r2" x="1218" y="35"/><use href="#r1" x="1266" y="10"/><use href="#r2" x="1314" y="55"/><use href="#r1" x="1362" y="-35"/><use href="#r2" x="1410" y="25"/></g>
