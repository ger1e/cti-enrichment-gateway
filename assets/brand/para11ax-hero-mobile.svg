<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX — mobile CTI Evidence Gateway identity</title>
<desc id="desc">Compact black-glass PARA11AX banner for GitHub mobile with cyan observation geometry, an oscillating red scanner, and the John Kiriakou evidence quotation.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020305"/><stop offset=".55" stop-color="#080D11"/><stop offset="1" stop-color="#020305"/></linearGradient>
<linearGradient id="tail"><stop stop-color="#FF1E2D" stop-opacity="0"/><stop offset=".7" stop-color="#FF1E2D" stop-opacity=".55"/><stop offset="1" stop-color="#FF4050"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00E5FF" opacity=".045"/></pattern>
<filter id="cg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="rg" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="720" height="620" rx="34" fill="url(#bg)"/><rect width="720" height="620" rx="34" fill="url(#grid)"/><rect x="2" y="2" width="716" height="616" rx="32" fill="none" stroke="#00E5FF" stroke-opacity=".22" stroke-width="4"/>
<g transform="translate(52 48)"><path d="M10 18 82 94 10 170M178 18 106 94 178 170" fill="none" stroke="#00E5FF" stroke-width="11" filter="url(#cg)"/><path d="M38 18 94 72 150 18M38 170 94 116 150 170" fill="none" stroke="#F3F7FA" stroke-width="3" opacity=".13"/><circle cx="94" cy="94" r="22" fill="#FF1E2D" opacity=".14" filter="url(#rg)"/><circle cx="94" cy="94" r="9" fill="#FF4050" filter="url(#rg)"/><circle cx="94" cy="94" r="2.5" fill="#fff"/></g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<text x="258" y="112" font-size="62" font-weight="900" letter-spacing="3"><tspan fill="#F3F7FA">PARA</tspan><tspan fill="#00E5FF">11</tspan><tspan fill="#F3F7FA">AX</tspan></text>
<text x="260" y="151" fill="#00E5FF" font-size="16" font-weight="800" letter-spacing="3.5">CTI // EVIDENCE GATEWAY</text><text x="260" y="180" fill="#7D8B95" font-size="11" font-weight="700" letter-spacing="2">BOUNDED · READ-ONLY · PROVENANCE-FIRST</text>
<g transform="translate(60 236)"><rect width="600" height="34" rx="17" fill="#100205" stroke="#FF1E2D" stroke-opacity=".36"/><rect x="18" y="14" width="564" height="6" rx="3" fill="#2A0509"/><g filter="url(#rg)"><rect x="18" y="8" width="118" height="18" rx="9" fill="url(#tail)"><animate attributeName="x" values="18;446;18" dur="1.8s" repeatCount="indefinite"/></rect><rect x="120" y="6" width="18" height="22" rx="9" fill="#FF4050"><animate attributeName="x" values="120;548;120" dur="1.8s" repeatCount="indefinite"/></rect></g><text x="300" y="57" text-anchor="middle" fill="#7D8B95" font-size="10" letter-spacing="2">ACTIVE OBSERVATION // SCANNER SWEEP</text></g>
<g transform="translate(64 338)"><rect width="592" height="1" fill="#00E5FF" opacity=".18"/><circle cx="8" cy="30" r="5" fill="#39FF88"/><text x="28" y="35" fill="#39FF88" font-size="12" font-weight="800" letter-spacing="2">EVIDENCE STATE // VERIFIED</text><text x="0" y="82" fill="#7D8B95" font-size="17">“You’ve got to follow the <tspan fill="#00E5FF" font-weight="800">evidence…</tspan></text><text x="0" y="116" fill="#7D8B95" font-size="17">That doesn’t make it <tspan fill="#F3F7FA" font-weight="800">fact.</tspan>”</text><text x="0" y="150" fill="#7D8B95" font-size="12" letter-spacing="2">— JOHN KIRIAKOU</text></g>
<g transform="translate(64 570)" font-size="10" letter-spacing="1.8"><text fill="#00E5FF">37 SOURCES</text><text x="212" fill="#39FF88">EVIDENCE V2</text><text x="438" fill="#7D8B95">STIX 2.1</text></g>
</g></svg>