<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX — mobile CTI Evidence Gateway identity</title>
<desc id="desc">Compact black-glass PARA11AX banner for GitHub mobile with cyan observation geometry, dense fast red code rain, an oscillating red scanner, and the John Kiriakou evidence quotation.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020305"/><stop offset=".55" stop-color="#080D11"/><stop offset="1" stop-color="#020305"/></linearGradient>
<linearGradient id="tail"><stop stop-color="#FF1E2D" stop-opacity="0"/><stop offset=".7" stop-color="#FF1E2D" stop-opacity=".55"/><stop offset="1" stop-color="#FF4050"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00E5FF" opacity=".045"/></pattern>
<filter id="cg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="rg" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="rc"><rect x="2" y="2" width="716" height="616" rx="32"/></clipPath>
<g id="r1" fill="#FF1E2D" opacity=".17" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="800"><text y="0">7</text><text y="17">0</text><text y="34">A</text><text y="51">1</text><text y="68">X</text><text y="85">9</text><text y="102">λ</text><text y="119">3</text><text y="136">F</text><text y="153">0</text><text y="170">1</text><text y="187">D</text><text y="204">8</text><text y="221">K</text><text y="238">2</text><text y="255">5</text><text y="272">E</text><text y="289">0</text><text y="306">7</text><text y="323">C</text><text y="340">1</text><text y="357">9</text></g>
<g id="r2" fill="#FF4050" opacity=".10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700"><text y="0">1</text><text y="16">B</text><text y="32">4</text><text y="48">0</text><text y="64">9</text><text y="80">Z</text><text y="96">6</text><text y="112">2</text><text y="128">Q</text><text y="144">8</text><text y="160">1</text><text y="176">0</text><text y="192">V</text><text y="208">3</text><text y="224">7</text><text y="240">A</text><text y="256">5</text><text y="272">1</text><text y="288">C</text><text y="304">0</text><text y="320">4</text><text y="336">8</text></g>
</defs>
<rect width="720" height="620" rx="34" fill="url(#bg)"/><rect width="720" height="620" rx="34" fill="url(#grid)"/>
<g clip-path="url(#rc)">
