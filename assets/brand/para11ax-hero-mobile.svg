</defs>
<rect width="720" height="360" rx="22" fill="url(#bg)"/>
<g opacity=".20"><use href="#gcol" x="14" y="30"/><use href="#gcol" x="48" y="-66"/><use href="#gcol" x="82" y="54"/><use href="#gcol" x="116" y="-24"/><use href="#rcol" x="150" y="32" opacity=".48"/><use href="#gcol" x="184" y="-78"/><use href="#gcol" x="218" y="44"/><use href="#gcol" x="252" y="-12"/><use href="#gcol" x="286" y="66"/><use href="#rcol" x="320" y="-18" opacity=".38"/><use href="#gcol" x="354" y="30"/><use href="#gcol" x="388" y="-72"/><use href="#gcol" x="422" y="58"/><use href="#gcol" x="456" y="-20"/><use href="#rcol" x="490" y="38" opacity=".38"/><use href="#gcol" x="524" y="-84"/><use href="#gcol" x="558" y="48"/><use href="#gcol" x="592" y="-16"/><use href="#gcol" x="626" y="62"/><use href="#rcol" x="660" y="-12" opacity=".42"/><use href="#gcol" x="694" y="34"/></g>
<rect x="1.5" y="1.5" width="717" height="357" rx="20.5" fill="none" stroke="#39FF14" stroke-opacity=".25" stroke-width="3"/>
