  <filter id="greenGlow" x="-120%" y="-160%" width="340%" height="420%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
