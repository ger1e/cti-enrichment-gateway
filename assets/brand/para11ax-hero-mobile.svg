<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">PARA11AX — mobile CTI Evidence Gateway identity</title>
  <desc id="desc">Portrait black-glass PARA11AX banner optimized for GitHub mobile with cyan observation geometry, Knight Rider-style scanner motion, evidence-state accents, and the John Kiriakou evidence quotation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020305"/>
      <stop offset=".52" stop-color="#080D11"/>
      <stop offset="1" stop-color="#020305"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="28%" r="58%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".12"/>
      <stop offset=".52" stop-color="#00E5FF" stop-opacity=".03"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1E2D" stop-opacity="0"/>
      <stop offset=".42" stop-color="#FF1E2D" stop-opacity=".18"/>
      <stop offset=".78" stop-color="#FF1E2D" stop-opacity=".62"/>
      <stop offset="1" stop-color="#FF4050"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00E5FF" stroke-width="1" opacity=".05"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity=".018"/>
    </pattern>
    <filter id="cyanGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redGlow" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="980" rx="34" fill="url(#bg)"/>
  <rect width="720" height="980" rx="34" fill="url(#bloom)"/>
  <rect width="720" height="980" rx="34" fill="url(#grid)"/>
  <rect width="720" height="980" rx="34" fill="url(#scanlines)"/>
  <rect x="2" y="2" width="716" height="976" rx="32" fill="none" stroke="#00E5FF" stroke-opacity=".22" stroke-width="4"/>

  <!-- compact observation mark -->
  <g transform="translate(216 70)">
    <path d="M18 24 L126 136 L18 248" fill="none" stroke="#00E5FF" stroke-width="13" opacity=".96" filter="url(#cyanGlow)"/>
    <path d="M270 24 L162 136 L270 248" fill="none" stroke="#00E5FF" stroke-width="13" opacity=".38"/>
    <path d="M58 24 L144 110 L230 24" fill="none" stroke="#F3F7FA" stroke-width="4" opacity=".16"/>
    <path d="M58 248 L144 162 L230 248" fill="none" stroke="#F3F7FA" stroke-width="4" opacity=".10"/>
    <path d="M40 136 H248" stroke="#00E5FF" stroke-width="2" stroke-dasharray="5 12" opacity=".22"/>
    <circle cx="144" cy="136" r="29" fill="#FF1E2D" opacity=".14" filter="url(#redGlow)"/>
    <circle cx="144" cy="136" r="11" fill="#FF4050" filter="url(#redGlow)"/>
    <circle cx="144" cy="136" r="3" fill="#FFFFFF"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <!-- mobile wordmark -->
    <text x="73" y="395" fill="#F3F7FA" font-size="82" font-weight="900" letter-spacing="7">PARA</text>
    <g transform="translate(327 320)">
      <rect x="4" y="0" width="15" height="76" rx="3" fill="#00E5FF" opacity=".21" filter="url(#cyanGlow)"/>
      <rect x="36" y="0" width="15" height="76" rx="3" fill="#00E5FF" opacity=".21" filter="url(#cyanGlow)"/>
      <text x="0" y="72" fill="#00E5FF" font-size="82" font-weight="900" letter-spacing="6">11</text>
      <rect x="39" y="5" width="9" height="66" fill="#FF4050" opacity=".13"/>
    </g>
    <text x="434" y="395" fill="#F3F7FA" font-size="82" font-weight="900" letter-spacing="7">AX</text>

    <text x="360" y="445" text-anchor="middle" fill="#00E5FF" font-size="19" font-weight="800" letter-spacing="4.2">CTI // EVIDENCE GATEWAY</text>
    <text x="360" y="480" text-anchor="middle" fill="#7D8B95" font-size="13" font-weight="700" letter-spacing="2.7">BOUNDED · READ-ONLY · PROVENANCE-FIRST</text>

    <!-- Knight Rider scanner sized for portrait -->
    <g transform="translate(60 535)">
      <rect width="600" height="38" rx="19" fill="#100205" stroke="#FF1E2D" stroke-opacity=".36" stroke-width="1.5"/>
      <rect x="18" y="16" width="564" height="6" rx="3" fill="#2A0509"/>
      <g fill="#FF1E2D" opacity=".26">
        <circle cx="42" cy="19" r="3.5"/><circle cx="74" cy="19" r="3.5"/><circle cx="106" cy="19" r="3.5"/><circle cx="138" cy="19" r="3.5"/>
        <circle cx="170" cy="19" r="3.5"/><circle cx="202" cy="19" r="3.5"/><circle cx="234" cy="19" r="3.5"/><circle cx="266" cy="19" r="3.5"/>
        <circle cx="298" cy="19" r="3.5"/><circle cx="330" cy="19" r="3.5"/><circle cx="362" cy="19" r="3.5"/><circle cx="394" cy="19" r="3.5"/>
        <circle cx="426" cy="19" r="3.5"/><circle cx="458" cy="19" r="3.5"/><circle cx="490" cy="19" r="3.5"/><circle cx="522" cy="19" r="3.5"/><circle cx="554" cy="19" r="3.5"/>
      </g>
      <g filter="url(#redGlow)">
        <rect x="18" y="10" width="118" height="18" rx="9" fill="url(#scanTail)">
          <animate attributeName="x" values="18;446;18" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
        </rect>
        <rect x="120" y="8" width="18" height="22" rx="9" fill="#FF4050">
          <animate attributeName="x" values="120;548;120" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
        </rect>
      </g>
      <text x="300" y="65" text-anchor="middle" fill="#7D8B95" font-size="11" letter-spacing="2">ACTIVE OBSERVATION // KNIGHT RIDER SWEEP</text>
    </g>

    <g transform="translate(66 665)">
      <rect width="588" height="1" fill="#00E5FF" opacity=".18"/>
      <circle cx="8" cy="34" r="5" fill="#39FF88"/>
      <text x="28" y="39" fill="#39FF88" font-size="12" font-weight="800" letter-spacing="2.1">EVIDENCE STATE // VERIFIED</text>
      <text x="0" y="91" fill="#7D8B95" font-size="18" letter-spacing=".45">“You’ve got to follow the</text>
      <text x="0" y="124" fill="#00E5FF" font-size="21" font-weight="800" letter-spacing=".55">evidence…</text>
      <text x="0" y="166" fill="#7D8B95" font-size="18" letter-spacing=".45">That doesn’t make it</text>
      <text x="0" y="199" fill="#F3F7FA" font-size="21" font-weight="800" letter-spacing=".55">fact.”</text>
      <text x="0" y="238" fill="#7D8B95" font-size="13" letter-spacing="2">— JOHN KIRIAKOU</text>
    </g>

    <g transform="translate(66 932)" font-size="11" letter-spacing="2">
      <text x="0" y="0" fill="#00E5FF">37 SOURCES</text>
      <text x="205" y="0" fill="#39FF88">EVIDENCE V2</text>
      <text x="415" y="0" fill="#7D8B95">STIX 2.1</text>
    </g>
  </g>
</svg>