<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" role="img" aria-labelledby="title desc">
  <title id="title">PARA11AX radar lockup</title>
  <desc id="desc">Compact phosphor radar with the PARA11AX wordmark.</desc>
  <style>
    .motion{display:block}.static-sweep{display:none}
    @media(prefers-reduced-motion: reduce){.motion{display:none}.static-sweep{display:block}}
  </style>
  <g transform="translate(28 28)">
    <circle r="24" fill="#020403" stroke="#39FF14" stroke-opacity=".62" stroke-width="1.4"/>
    <circle r="16" fill="none" stroke="#39FF14" stroke-opacity=".34"/>
    <circle r="8" fill="none" stroke="#39FF14" stroke-opacity=".24"/>
    <path d="M-24 0H24M0-24V24" stroke="#39FF14" stroke-opacity=".16"/>
    <g class="motion">
      <path d="M0 0 22-6A23 23 0 0 1 22 6Z" fill="#39FF14" fill-opacity=".11"/>
      <path d="M0 0H23" stroke="#39FF14" stroke-width="1.8" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
    <g class="static-sweep" transform="rotate(28)">
      <path d="M0 0 22-6A23 23 0 0 1 22 6Z" fill="#39FF14" fill-opacity=".1"/>
      <path d="M0 0H23" stroke="#39FF14" stroke-width="1.8"/>
    </g>
    <circle cx="12" cy="-10" r="2" fill="#39FF14"/>
    <circle cx="-9" cy="11" r="1.7" fill="#39FF14" fill-opacity=".72"/>
    <circle cx="17" cy="13" r="1.8" fill="#FF2438"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="25" font-weight="900" letter-spacing="2.2">
    <text x="66" y="36"><tspan fill="#F7FFF6">PARA</tspan><tspan fill="#39FF14">11</tspan><tspan fill="#F7FFF6">AX</tspan></text>
  </g>
  <path d="M66 45h213" stroke="#39FF14" stroke-opacity=".3"/>
  <path d="M279 45h12" stroke="#FF2438" stroke-opacity=".7"/>
  <circle cx="295" cy="45" r="1.8" fill="#FF2438"/>
</svg>
