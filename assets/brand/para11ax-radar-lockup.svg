<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" role="img" aria-labelledby="title desc">
  <title id="title">PARA11AX</title>
  <desc id="desc">Compact PARA11AX wordmark with a moving narrow phosphor PPI radar sweep.</desc>
  <style>.motion{display:block}.static-sweep{display:none}@media(prefers-reduced-motion: reduce){.motion{display:block}.static-sweep{display:none}}</style>
  <g transform="translate(36 36)" data-radar="ppi">
    <circle r="31" fill="#020403" stroke="#39FF14" stroke-opacity=".42" stroke-width="1.2"/>
    <circle r="21" fill="none" stroke="#39FF14" stroke-opacity=".18"/>
    <circle r="11" fill="none" stroke="#39FF14" stroke-opacity=".13"/>
    <g id="crosshair" stroke="#39FF14"><path d="M-31 0H31M0-31V31" stroke-opacity=".16"/><path d="M0-31v6M0 25v6M-31 0h6M25 0h6" stroke-opacity=".5"/></g>
    <g class="motion"><path d="M0 0L28-6A29 29 0 0 1 29 0Z" fill="#39FF14" fill-opacity=".08"/><path d="M0 0H29" stroke="#39FF14" stroke-width="1.35"/><path d="M0 0H29" stroke="#F7FFF6" stroke-opacity=".25" stroke-width=".45"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite"/></g>
    <g class="static-sweep" transform="rotate(34)"><path d="M0 0L28-6A29 29 0 0 1 29 0Z" fill="#39FF14" fill-opacity=".08"/><path d="M0 0H29" stroke="#39FF14" stroke-width="1.35"/></g>
    <circle cx="14" cy="-13" r="1.7" fill="#39FF14" fill-opacity=".86"/><circle cx="-15" cy="12" r="1.5" fill="#39FF14" fill-opacity=".72"/><circle cx="19" cy="15" r="1.6" fill="#FF2438" fill-opacity=".82"/>
    <circle r="1.5" fill="#D9FFD3"/>
  </g>
  <text x="82" y="48" data-wordmark="para11ax-angular-a" aria-label="PARA11AX" font-family="Arial Black,Arial,sans-serif" font-size="35" font-weight="900" letter-spacing="1"><tspan fill="#F7FFF6">PΛRΛ</tspan><tspan fill="#39FF14">11</tspan><tspan fill="#F7FFF6">ΛX</tspan></text>
</svg>
