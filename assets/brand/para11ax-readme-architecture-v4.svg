<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="t d"><title id="t">PARA11AX request path</title><desc id="d">Normalized PARA11AX request-path panel showing the bounded caller, classifier, scheduler, fixed egress, provider fabric, evidence and outputs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020403"/><stop offset=".55" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;letter-spacing:1.4px}</style></defs><rect width="720" height="760" rx="12" fill="url(#bg)"/><rect x="2" y="2" width="716" height="756" rx="12" fill="none" stroke="#39FF14" stroke-opacity=".3"/><g class="m" font-size="15" letter-spacing="1.8" fill="#8DA391"><text x="26" y="30">REQUEST PATH</text><text x="694" y="30" text-anchor="end">FIXED EGRESS</text></g><path d="M26 48H694" stroke="#39FF14" stroke-opacity=".3"/><g transform="translate(26 70)"><rect width="668" height="112" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="30" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">01 // CALLER</text><text x="20" y="72" class="h" font-size="22" fill="#F7FFF6">CLIENT · ANALYST UI · CLI · MALTEGO</text><text x="20" y="99" class="m" font-size="16" fill="#8DA391">one bounded observable or bounded batch</text></g><path d="M360 182V206" stroke="#39FF14" stroke-opacity=".45" stroke-width="3"/><g transform="translate(26 206)"><rect width="668" height="118" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="30" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">02 // ADMISSION</text><text x="20" y="70" class="h" font-size="22" fill="#F7FFF6">AUTH → CLASSIFIER → FIXED PROFILE</text><text x="20" y="99" class="m" font-size="16" fill="#39FF14">fast · standard · full // no provide