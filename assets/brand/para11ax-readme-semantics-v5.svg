<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" role="img" aria-labelledby="t d"><title id="t">PARA11AX semantic firewall</title><desc id="d">GER1E-normalized semantic firewall separating Evidence v2, deterministic derived intelligence, context, threat evidence, failures and attribution.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020403"/><stop offset=".55" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;letter-spacing:1.4px}</style></defs><rect width="720" height="860" rx="12" fill="url(#bg)"/><rect x="2" y="2" width="716" height="856" rx="12" fill="none" stroke="#39FF14" stroke-opacity=".3"/><g class="m" font-size="15" letter-spacing="1.8" fill="#8DA391"><text x="26" y="30">SEMANTIC FIREWALL</text><text x="694" y="30" text-anchor="end">NO UNIVERSAL SCORE</text></g><path d="M26 48H694" stroke="#39FF14" stroke-opacity=".3"/><g transform="translate(26 68)"><rect width="668" height="110" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".38"/><text x="20" y="28" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">01 // AUTHORITATIVE RECORD</text><text x="20" y="58" class="h" font-size="22" fill="#F7FFF6">EVIDENCE V2 = OBSERVED / NORMALIZED FACTS</text><text x="20" y="84" class="m" font-size="17" fill="#39FF14">provider · parser · timestamps · fingerprints</text><text x="20" y="103" class="m" font-size="17" fill="#39FF14">explicit relationships</text></g><g transform="translate(26 190)"><rect width="668" height="110" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="28" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">02 // DERIVED CONTEXT</text><text x="20" y="58" class="h" font-size="22" fill="#F7FFF6">INTELLIGENCE KERNEL v1.0 ≠ EVIDENCE</text><text x="20" y="84" class="m" font-size="17" fill="#8DA391">strength · diversity · time · contradictions</text><text x="20" y="103" class="m" font-size="17" fill="#8DA391">pivots · priority</text></g><g transform="translate(26 312)"><rect width="668" height="92" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="28" class="h" font-size="22" fill="#39FF14">ABSENCE ≠ BENIGN</text><text x="20" y="56" class="m" font-size="17" fill="#F7FFF6">not found / not listed / no result</text><text x="20" y="77" class="m" font-size="17" fill="#F7FFF6">remain source-scoped absence</text></g><g transform="translate(26 416)"><rect width="668" height="92" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="28" class="h" font-size="22" fill="#39FF14">CONTEXT ≠ REPUTATION</text><text x="20" y="56" class="m" font-size="17" fill="#F7FFF6">routing · registration · Tor · scanner</text><text x="20" y="77" class="m" font-size="17" fill="#F7FFF6">exposure · certificate · ATT&amp;CK</text></g><g transform="translate(26 520)"><rect width="668" height="92" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="28" class="h" font-size="22" fill="#39FF14">FAILURE ≠ NEGATIVE EVIDENCE</text><text x="20" y="56" class="m" font-size="17" fill="#F7FFF6">timeout · 429 · 5xx · circuit open</text><text x="20" y="77" class="m" font-size="17" fill="#F7FFF6">= coverage limitation</text></g><g transform="translate(26 624)"><rect width="668" height="92" rx="10" fill="#050805" stroke="#FF2438" stroke-opacity=".32"/><text x="20" y="28" class="h" font-size="22" fill="#F7FFF6">INFRASTRUCTURE ≠ ATTRIBUTION</text><text x="20" y="56" class="m" font-size="17" fill="#8DA391">hosting / ASN / DNS / certificate</text><text x="20" y="77" class="m" font-size="17" fill="#8DA391">malware proximity = pivots only</text></g><g transform="translate(26 728)"><rect width="668" height="120" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".4"/><text x="20" y="49" class="m" font-size="17" fill="#F7FFF6">KEV = EXPLOITED</text><text x="20" y="84" class="m" font-size="17" fill="#F7FFF6">EPSS = PROBABILITY</text><text x="350" y="49" class="m" font-size="15" fill="#8DA391">NO LLM · NO SYNTHETIC THREAT SCORE</text><text x="350" y="84" class="m" font-size="17" fill="#F7FFF6">CVSS = SEVERITY</text></g></svg>