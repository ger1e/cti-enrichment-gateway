<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">PARA11AX PPI threat radar</title>
  <desc id="desc">Plan-position-indicator radar with range rings, azimuth ticks, bearing labels, rotating sweep, and persistent target returns.</desc>
  <defs>
    <radialGradient id="radar-bg" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#102214" stop-opacity=".78"/>
      <stop offset=".72" stop-color="#071009" stop-opacity=".84"/>
      <stop offset="1" stop-color="#020403" stop-opacity=".96"/>
    </radialGradient>
    <linearGradient id="sweep-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14" stop-opacity=".02"/>
      <stop offset=".64" stop-color="#39FF14" stop-opacity=".08"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity=".34"/>
    </linearGradient>
    <filter id="ppi-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scope-clip"><circle cx="260" cy="260" r="236"/></clipPath>
  </defs>
  <style>
    .motion{display:block}.static-sweep{display:none}
    .scope-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8DA391;font-size:11px;letter-spacing:1px}
    .bearing{fill:#F7FFF6;font-size:12px;font-weight:700}
    @media(max-width:300px){.detail{display:none}.scope-text{font-size:13px}}
    @media(prefers-reduced-motion:reduce){.motion{display:none}.static-sweep{display:block}}
  </style>

  <circle cx="260" cy="260" r="250" fill="#020403" stroke="#39FF14" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="260" cy="260" r="241" fill="url(#radar-bg)" stroke="#39FF14" stroke-opacity=".58" stroke-width="2"/>
  <circle cx="260" cy="260" r="236" fill="none" stroke="#F7FFF6" stroke-opacity=".08"/>

  <g id="azimuth-ticks" class="detail" fill="none" stroke="#39FF14">
    <circle cx="260" cy="260" r="228" stroke-opacity=".34" stroke-width="6" stroke-dasharray="1.2 18.7"/>
    <circle cx="260" cy="260" r="222" stroke-opacity=".2" stroke-width="3" stroke-dasharray="1 8.68"/>
    <path d="M260 19v15M260 486v15M19 260h15M486 260h15" stroke-opacity=".74" stroke-width="2"/>
    <path d="M103 103l10 10M407 407l10 10M103 417l10-10M407 113l10-10" stroke-opacity=".42" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#scope-clip)">
    <g fill="none" stroke="#39FF14">
      <circle class="range-ring" cx="260" cy="260" r="55" stroke-opacity=".18"/>
      <circle class="range-ring" cx="260" cy="260" r="110" stroke-opacity=".22"/>
      <circle class="range-ring" cx="260" cy="260" r="165" stroke-opacity=".26"/>
      <circle class="range-ring" cx="260" cy="260" r="220" stroke-opacity=".31" stroke-width="1.4"/>
      <path d="M40 260H480M260 40V480" stroke-opacity=".22"/>
      <path d="M104 104 416 416M416 104 104 416" stroke-opacity=".11" stroke-dasharray="4 8"/>
    </g>

    <g class="detail scope-text">
      <text x="266" y="209">RNG 25</text>
      <text x="266" y="154">RNG 50</text>
      <text x="266" y="99">RNG 75</text>
      <text x="266" y="44">RNG 100</text>
    </g>

    <g id="sweep-trail" class="motion" transform="translate(260 260)" opacity=".48">
      <path d="M0 0L219 -52A225 225 0 0 1 219 52Z" fill="url(#sweep-gradient)"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite"/>
    </g>
    <g id="ppi-sweep" class="motion" transform="translate(260 260)" filter="url(#ppi-glow)">
      <path d="M0 0H222" stroke="#39FF14" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M0 -1H222" stroke="#F7FFF6" stroke-opacity=".35" stroke-width=".7"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite"/>
    </g>
    <g class="static-sweep" transform="translate(260 260) rotate(34)">
      <path d="M0 0L219 -52A225 225 0 0 1 219 52Z" fill="url(#sweep-gradient)" opacity=".45"/>
      <path d="M0 0H222" stroke="#39FF14" stroke-width="2.2"/>
    </g>

    <g filter="url(#ppi-glow)">
      <g class="target-trail" opacity=".25">
        <circle cx="368" cy="147" r="2.3" fill="#39FF14"/><circle cx="362" cy="153" r="1.9" fill="#39FF14"/><circle cx="356" cy="159" r="1.4" fill="#39FF14"/>
      </g>
      <circle class="target-return" cx="374" cy="141" r="4.6" fill="#39FF14"><animate attributeName="opacity" values=".48;1;.48" dur="2.4s" repeatCount="indefinite"/></circle>

      <g class="target-trail" opacity=".21">
        <circle cx="171" cy="332" r="2.2" fill="#39FF14"/><circle cx="177" cy="327" r="1.7" fill="#39FF14"/><circle cx="183" cy="322" r="1.2" fill="#39FF14"/>
      </g>
      <circle class="target-return" cx="165" cy="337" r="4" fill="#39FF14"><animate attributeName="opacity" values=".42;.88;.42" dur="3.1s" repeatCount="indefinite"/></circle>

      <g class="target-trail" opacity=".18">
        <circle cx="347" cy="348" r="2.1" fill="#39FF14"/><circle cx="341" cy="343" r="1.6" fill="#39FF14"/><circle cx="335" cy="338" r="1.2" fill="#39FF14"/>
      </g>
      <circle class="target-return" cx="353" cy="353" r="3.8" fill="#39FF14" fill-opacity=".82"/>

      <g class="target-trail" opacity=".22">
        <circle cx="202" cy="151" r="2.2" fill="#FF2438"/><circle cx="207" cy="157" r="1.7" fill="#FF2438"/><circle cx="212" cy="163" r="1.2" fill="#FF2438"/>
      </g>
      <circle class="target-return" cx="197" cy="145" r="4.4" fill="#FF2438"><animate attributeName="opacity" values=".38;1;.38" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g class="detail scope-text bearing" text-anchor="middle">
    <text x="260" y="17">000</text>
    <text x="503" y="264">090</text>
    <text x="260" y="514">180</text>
    <text x="17" y="264">270</text>
  </g>
  <g class="detail scope-text" text-anchor="middle">
    <text x="260" y="31">N</text><text x="489" y="248">E</text><text x="260" y="497">S</text><text x="31" y="248">W</text>
  </g>

  <g transform="translate(260 260)">
    <circle r="7" fill="#020403" stroke="#F7FFF6" stroke-opacity=".6"/>
    <circle r="2" fill="#39FF14" filter="url(#ppi-glow)"/>
    <path d="M-12 0H12M0-12V12" stroke="#39FF14" stroke-opacity=".72" stroke-width="1"/>
  </g>

  <path d="M72 467h92" stroke="#39FF14" stroke-opacity=".3"/><text class="scope-text detail" x="72" y="458">PPI // 360° // TRACK</text>
</svg>
