<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">PARA11AX</title><desc id="desc">PARA11AX mobile README hero with one animated PPI radar and John Kiriakou quote.</desc>
<defs><radialGradient id="scope" cx="50%" cy="50%" r="52%"><stop offset="0" stop-color="#0A170C"/><stop offset=".72" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></radialGradient><linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39FF14" stop-opacity="0"/><stop offset=".72" stop-color="#39FF14" stop-opacity=".07"/><stop offset="1" stop-color="#39FF14" stop-opacity=".36"/></linearGradient></defs>
<style>.radar-css{transform-box:view-box;transform-origin:360px 400px;animation:radar-spin 9.6s linear infinite}.static-sweep{display:none}@keyframes radar-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.radar-css{display:none}.static-sweep{display:block}}</style>
<rect width="720" height="900" fill="#020403"/>
<text x="360" y="108" text-anchor="middle" data-wordmark="para11ax-angular-a" aria-label="PARA11AX" font-family="Arial Black,Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="1"><tspan fill="#F7FFF6">PΛRΛ</tspan><tspan fill="#39FF14">11</tspan><tspan fill="#F7FFF6">ΛX</tspan></text>
<g transform="translate(360 400)" data-radar="ppi" aria-label="PPI radar"><circle r="238" fill="url(#scope)" stroke="#39FF14" stroke-width="2" stroke-opacity=".76"/><circle r="226" fill="none" stroke="#39FF14" stroke-opacity=".38" stroke-width="6" stroke-dasharray="1 12"/><circle r="184" fill="none" stroke="#39FF14" stroke-opacity=".24"/><circle r="138" fill="none" stroke="#39FF14" stroke-opacity=".22"/><circle r="92" fill="none" stroke="#39FF14" stroke-opacity=".2"/><circle r="46" fill="none" stroke="#39FF14" stroke-opacity=".18"/><g stroke="#39FF14"><path d="M-238 0H238M0-238V238" stroke-opacity=".34"/><path d="M-168-168L168 168M168-168L-168 168" stroke-opacity=".12"/><path d="M0-238v17M0 221v17M-238 0h17M221 0h17" stroke-opacity=".9" stroke-width="2"/></g><g fill="#39FF14"><circle cx="112" cy="-124" r="4.8"/><circle cx="-137" cy="91" r="4.2" fill-opacity=".84"/><circle cx="142" cy="114" r="4" fill-opacity=".74"/><circle cx="-66" cy="-149" r="3.2" fill-opacity=".66"/></g><g fill="#FF2438"><circle cx="-144" cy="-89" r="4.7"/><circle cx="165" cy="46" r="3.9"/></g><circle r="8" fill="#020403" stroke="#F7FFF6" stroke-opacity=".6"/><circle r="2.8" fill="#39FF14"/></g>
<g class="radar-css" aria-hidden="true"><g transform="translate(360 400)"><g><path d="M0 0 220-59A228 228 0 0 1 223 43Z" fill="url(#trail)"/><path d="M0 0H227" stroke="#39FF14" stroke-width="2.8" stroke-linecap="round"/><path d="M0-1H227" stroke="#F7FFF6" stroke-opacity=".38" stroke-width=".8"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9.6s" repeatCount="indefinite"/></g></g></g>
<g class="static-sweep" transform="translate(360 400) rotate(34)" aria-hidden="true"><path d="M0 0 220-59A228 228 0 0 1 223 43Z" fill="url(#trail)"/><path d="M0 0H227" stroke="#39FF14" stroke-width="2.8"/></g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="78" y="710" fill="#39FF14" font-size="48" font-weight="900">“</text><text x="126" y="710" fill="#F7FFF6" font-size="24">You’ve got to follow</text><text x="126" y="752" fill="#F7FFF6" font-size="24">the evidence…</text><text x="126" y="794" fill="#F7FFF6" font-size="24">That doesn’t make it fact.</text><text x="126" y="838" fill="#39FF14" font-size="20">— John Kiriakou</text></g><path d="M126 864H594" stroke="#39FF14" stroke-opacity=".36"/>
</svg>